<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting…</title>
    <link rel="canonical" href="{{ page.redirect_to | escape }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | escape }}">
    <meta name="robots" content="noindex, follow">
    <script>location.replace({{ page.redirect_to | jsonify }});</script>
  </head>
  <body>
    <main>
      <h1>This page has moved</h1>
      <p>Continue to <a href="{{ page.redirect_to | escape }}">{{ page.redirect_title | default: page.redirect_to | escape }}</a>.</p>
    </main>
  </body>
</html>
