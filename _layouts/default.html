<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    {%- include header.html -%}

    <main class="page-content" id="main-content" aria-label="Content" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <button type="button" class="back-to-top" id="back-to-top" hidden aria-label="Back to top">↑</button>
    <script>{% include site.js %}</script>
  </body>

</html>
