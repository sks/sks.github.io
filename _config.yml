theme: minima
title: "Production Notes"
description: "Production engineering notes on enterprise AI agents, workflows, and SRE — by Sabith K S, Principal Engineer at StackGen."
url: "https://productionnotes.dev"
baseurl: ""

author:
  name: Sabith K S
  title: Principal Engineer
  company: StackGen
  github: "https://github.com/sks"
  linkedin: "https://linkedin.com/in/sabithks"

newsletter_url: "https://sabithks.substack.com/subscribe"
substack_latest_issue_url: "https://sabithks.substack.com/p/start-here"
substack_latest_issue_label: "Issue #1 — Start here"

indexnow_key: "a9faf91a081fa0b3582b992495fc78fa"
indexnow_host: "productionnotes.dev"

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/sks" }
    - { platform: linkedin, user_url: "https://linkedin.com/in/sabithks" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  posts_limit: 20
  excerpt_only: true

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Sabith K S"
  # Keep thin / non-content paths out of jekyll-sitemap if they are ever published.
  - scope:
      path: "samples"
    values:
      sitemap: false
  - scope:
      path: "terraform"
    values:
      sitemap: false

header_pages:
  - series/enterprise-ai-agents-go.md
  - about.md

# Talk source packs (Marp decks, transcripts, demo YAML) stay in git for
# GitHub browsing. Only talks/index.md is a published page — unlisted
# (not in header_pages or post cross-links). Direct URL: /talks/
#
# samples/ and terraform/ stay in git for clone/ops, but are not site pages.
# Publishing their README.md files inflated sitemap.xml with non-canonical
# teaching/infra URLs (Google: include only URLs you want in search results).
exclude:
  - talks/conf42-observability-2026/
  - samples/
  - terraform/
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Build future-dated posts. GitHub Pages only rebuilds on push, so a post dated
# ahead of the last build would otherwise 404 until someone triggers a new build.
future: true
