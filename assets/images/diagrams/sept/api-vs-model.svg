<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Endpoint, model and effort are separate choices</title><desc id="desc">API endpoint and model class are independent choices; reasoning effort applies only where supported. A supported combination produces a call whose trace separates id, usage, and latency.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Endpoint, model and effort are separate choices</text><rect x="50" y="110" width="290" height="115" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="195.0" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">API endpoint</text><text x="195.0" y="167" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Chat Completions / Responses</text><rect x="405" y="110" width="290" height="115" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="550.0" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Model / role</text><text x="550.0" y="167" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">normal or reasoning model</text><rect x="760" y="110" width="290" height="115" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="905.0" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Reasoning effort</text><text x="905.0" y="167" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">only if supported</text><path d="M195 225 L195 275 L460 275 L460 298" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M550 225 L550 298" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M905 225 L905 275 L640 275 L640 298" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="410" y="304" width="280" height="78" rx="11" fill="#ffffff" stroke="#53697c" stroke-width="1.6"/><text x="550.0" y="334" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Supported call</text><text x="550.0" y="361" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">tools + model + settings</text><path d="M550 382 L550 415" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="85" y="422" width="280" height="80" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="225.0" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Response id</text><text x="225.0" y="479" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">which endpoint answered</text><rect x="410" y="422" width="280" height="80" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="550.0" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Usage fields</text><text x="550.0" y="479" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">reasoning tokens, if any</text><rect x="735" y="422" width="280" height="80" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="875.0" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Timestamps / errors</text><text x="875.0" y="479" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">retry and tool wait</text><path d="M550 405 L225 405 L225 416" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M550 405 L875 405 L875 416" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">A resp_ id identifies the endpoint, not proof of reasoning tokens.</text></svg>
