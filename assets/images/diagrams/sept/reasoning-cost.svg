<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Reasoning and tool wait both add to a run</title><desc id="desc">Two role configurations on the same task may spend different time in model thinking, tool waits and retries. Compare resulting evidence and quality before declaring either cheaper.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Reasoning and tool wait both add to a run</text><rect x="42" y="217" width="205" height="96" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="144.5" y="247" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Same task</text><text x="144.5" y="274" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">same tool access</text><rect x="330" y="113" width="240" height="98" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="450.0" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Higher effort</text><text x="450.0" y="170" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">thinking per turn</text><rect x="330" y="334" width="240" height="98" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="450.0" y="364" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Lower effort</text><text x="450.0" y="391" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">less thinking per turn</text><rect x="680" y="113" width="245" height="98" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="802.5" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Tool work A</text><text x="802.5" y="170" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">wait + observations</text><rect x="680" y="334" width="245" height="98" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="802.5" y="364" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Tool work B</text><text x="802.5" y="391" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">wait + observations</text><path d="M247 253 L285 253 L285 162 L324 162" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M285 253 L285 383 L324 383" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M570 162 L674 162" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M570 383 L674 383" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1000" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Judge both:</text><text x="1000" y="265" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">quality</text><text x="1000" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">wall + usage</text><path d="M925 162 L960 162 L960 207" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M925 383 L960 383 L960 315" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">More thinking tokens are usage, not proof of a better diagnosis.</text></svg>
