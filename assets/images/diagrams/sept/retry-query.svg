<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Classify a failed query before retrying</title><desc id="desc">A query may return data, a genuine empty result, or a backend failure. Changed scope or a different route is allowed once; repeated same observations halt with partial findings.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Classify a failed query before retrying</text><rect x="40" y="201" width="215" height="100" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="147.5" y="231" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Metric / log query</text><text x="147.5" y="258" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">scope + time window</text><rect x="330" y="201" width="245" height="100" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="452.5" y="231" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Typed outcome</text><text x="452.5" y="258" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">data / empty / failed</text><rect x="700" y="92" width="310" height="90" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="855.0" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Use evidence</text><text x="855.0" y="149" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">record observed values</text><rect x="700" y="226" width="310" height="90" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="855.0" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Repair or alternate</text><text x="855.0" y="283" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">change query / source once</text><rect x="700" y="360" width="310" height="95" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="855.0" y="390" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Stop with gap</text><text x="855.0" y="417" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">repeat fingerprint / budget</text><path d="M255 251 L324 251" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M575 230 L635 230 L635 137 L694 137" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="605" y="150" text-anchor="start" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">data</text><path d="M575 251 L694 271" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="611" y="286" text-anchor="start" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">empty / failed</text><path d="M855 316 L855 354" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1020" y="345" text-anchor="end" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">no progress</text><path d="M700 270 L640 270 L640 325 L290 325 L290 251 L324 251" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="475" y="347" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">changed retry, bounded</text><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Never turn an upstream failure into “no matching signal.”</text></svg>
