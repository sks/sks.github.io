<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Page the evidence; keep the full result</title><desc id="desc">The host retains the full tool result and gives the model a bounded page plus cursor. A later cursor request reads from stored bytes, not a lossy summary.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Page the evidence; keep the full result</text><rect x="40" y="205" width="220" height="92" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="150.0" y="235" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Tool result</text><text x="150.0" y="262" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">large response</text><rect x="335" y="111" width="265" height="100" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="467.5" y="141" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Host store</text><text x="467.5" y="168" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">complete result + id</text><rect x="335" y="322" width="265" height="100" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="467.5" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Prompt page</text><text x="467.5" y="379" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">bounded bytes + cursor</text><rect x="730" y="322" width="285" height="100" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="872.5" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Agent choice</text><text x="872.5" y="379" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">fetch next page if needed</text><path d="M260 251 L290 251 L290 161 L329 161" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M467 211 L467 316" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M600 372 L724 372" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M872 322 L872 256 L670 256 L670 161 L606 161" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="783" y="245" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">cursor fetch</text><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">The first page is not the entire observation.</text></svg>
