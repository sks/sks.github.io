<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Choose the work shape, then measure it</title><desc id="desc">A narrow task can use one tool loop. Independent multi-part work may justify a planner and scoped digs, but handoff and synthesis cost extra.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Choose the work shape, then measure it</text><rect x="40" y="216" width="205" height="94" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="142.5" y="246" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Task scope</text><text x="142.5" y="273" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">one plane or multiple?</text><rect x="325" y="91" width="245" height="82" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="447.5" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Single agent</text><text x="447.5" y="148" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">one context / tool loop</text><rect x="325" y="335" width="245" height="82" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="447.5" y="365" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Planner</text><text x="447.5" y="392" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">assign bounded subgoals</text><rect x="660" y="286" width="190" height="75" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="755.0" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Dig A</text><text x="755.0" y="343" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">own context</text><rect x="880" y="286" width="190" height="75" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="975.0" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Dig B</text><text x="975.0" y="343" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">own context</text><rect x="770" y="410" width="190" height="80" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="865.0" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Join</text><text x="865.0" y="467" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">check receipts</text><rect x="750" y="92" width="245" height="82" rx="11" fill="#ffffff" stroke="#53697c" stroke-width="1.6"/><text x="872.5" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Answer</text><text x="872.5" y="149" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">evidence + unknowns</text><path d="M245 249 L275 249 L275 132 L319 132" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="283" y="111" text-anchor="start" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">narrow</text><path d="M570 132 L744 132" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M245 279 L275 279 L275 376 L319 376" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="283" y="319" text-anchor="start" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">separable</text><path d="M570 376 L615 376 L615 323 L654 323" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M570 376 L860 376 L860 323 L874 323" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M755 361 L755 390 L821 390 L821 404" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M975 361 L975 390 L906 390 L906 404" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M865 410 L865 205 L875 205 L875 180" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Compare correctness first, then full-tree tokens and elapsed time.</text></svg>
