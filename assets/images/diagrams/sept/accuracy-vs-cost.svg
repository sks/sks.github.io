<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Quality gate before cost ranking</title><desc id="desc">First check whether an answer meets the evidence and correctness bar. Only acceptable answers enter the time and token comparison; failed answers retain their failure record.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Quality gate before cost ranking</text><rect x="50" y="213" width="230" height="90" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="165.0" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Candidate answer</text><text x="165.0" y="270" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">claims + receipts</text><rect x="360" y="213" width="245" height="90" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="482.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Quality gate</text><text x="482.5" y="270" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">complete and supported?</text><rect x="755" y="95" width="285" height="96" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="897.5" y="125" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Pass</text><text x="897.5" y="152" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">compare wall + tokens</text><rect x="755" y="330" width="285" height="96" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="897.5" y="360" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Fail</text><text x="897.5" y="387" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">record missing evidence</text><path d="M280 258 L354 258" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M605 238 L660 238 L660 143 L749 143" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M605 278 L660 278 L660 378 L749 378" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="678" y="133" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">yes</text><text x="678" y="400" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">no</text><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">A fast stub is a failed run, not an efficiency win.</text></svg>
