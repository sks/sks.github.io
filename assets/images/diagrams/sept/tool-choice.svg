<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Discover, measure, then check the observation</title><desc id="desc">A catalog helps choose a tool, but only a live measurement for the right scope and window yields evidence. Empty or failed outcomes must be separated before the final claim.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Discover, measure, then check the observation</text><rect x="45" y="203" width="220" height="95" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="155.0" y="233" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Tool catalog</text><text x="155.0" y="260" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">discover capabilities</text><rect x="330" y="203" width="220" height="95" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="440.0" y="233" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Live query</text><text x="440.0" y="260" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">signal + scope / window</text><rect x="625" y="105" width="215" height="91" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="732.5" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Data</text><text x="732.5" y="162" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">use measured values</text><rect x="625" y="316" width="215" height="91" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="732.5" y="346" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Empty / failed</text><text x="732.5" y="373" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">revise or state gap</text><rect x="900" y="203" width="165" height="95" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="982.5" y="233" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Finding</text><text x="982.5" y="260" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">cite receipts</text><path d="M265 250 L324 250" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M550 234 L590 234 L590 150 L619 150" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M550 266 L590 266 L590 360 L619 360" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M840 150 L875 150 L875 233 L894 233" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M840 360 L875 360 L875 268 L894 268" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Tool discovery is not itself an incident measurement.</text></svg>
