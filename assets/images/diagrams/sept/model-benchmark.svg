<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Hold conditions fixed; branch candidates</title><desc id="desc">The same incident, tools and budgets feed each candidate. Compare diagnosis quality with elapsed time and full-run usage; no single leaderboard number replaces the trace.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Hold conditions fixed; branch candidates</text><rect x="45" y="208" width="225" height="112" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="157.5" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Saved incident</text><text x="157.5" y="265" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">prompt + expected facts</text><text x="157.5" y="289" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">same tools / limits</text><rect x="405" y="99" width="230" height="90" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="520.0" y="129" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Candidate A</text><text x="520.0" y="156" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">model × mode</text><rect x="405" y="260" width="230" height="90" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="520.0" y="290" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Candidate B</text><text x="520.0" y="317" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">model × mode</text><rect x="405" y="419" width="230" height="90" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="520.0" y="449" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Candidate C</text><text x="520.0" y="476" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">model × mode</text><rect x="765" y="204" width="285" height="112" rx="11" fill="#ffffff" stroke="#53697c" stroke-width="1.6"/><text x="907.5" y="234" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Compare outputs</text><text x="907.5" y="261" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">quality; wall; tokens</text><text x="907.5" y="285" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">inspect each trace</text><path d="M270 264 L330 264 L330 144 L399 144" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M330 264 L399 305" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M330 264 L330 464 L399 464" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M635 144 L705 144 L705 246 L759 246" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M635 305 L759 264" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M635 464 L705 464 L705 289 L759 289" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Repeated equivalent incidents are needed before ranking reliability.</text></svg>
