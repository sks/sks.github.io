<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Grade claims against observations, not fluency</title><desc id="desc">The answer and its cited tool observations meet at a grader. A separate known mechanism and rubric help assess coverage and truth, which are not the same score.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Grade claims against observations, not fluency</text><rect x="45" y="105" width="290" height="96" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="190.0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Agent Theory</text><text x="190.0" y="162" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">claim + unknowns + action</text><rect x="45" y="298" width="290" height="100" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="190.0" y="328" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Saved observations</text><text x="190.0" y="355" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">rule, numbers, logs, gaps</text><rect x="705" y="105" width="340" height="96" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="875.0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Known incident + rubric</text><text x="875.0" y="162" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">expected mechanism / requirements</text><rect x="405" y="224" width="240" height="112" rx="11" fill="#ffffff" stroke="#53697c" stroke-width="1.6"/><text x="525.0" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Grader</text><text x="525.0" y="281" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">link each claim to evidence</text><text x="525.0" y="305" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">and check required parts</text><rect x="735" y="318" width="310" height="105" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="890.0" y="348" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Review result</text><text x="890.0" y="375" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">coverage + support</text><text x="890.0" y="399" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">unresolved cause flagged</text><path d="M335 153 L370 153 L370 258 L399 258" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M335 348 L370 348 L370 302 L399 302" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M705 153 L675 153 L675 274 L651 274" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M645 296 L690 296 L690 370 L729 370" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Checklist coverage cannot alone establish the true root cause.</text></svg>
