<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">One ReAct loop vs a ReAcTree</title><desc id="desc">Left: a single agent repeats tool use in one context. Right: a parent delegates independent scoped investigations to two children and joins their evidence.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">One ReAct loop vs a ReAcTree</text><text x="230" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#253d53" font-family="Arial,Helvetica,sans-serif">SINGLE CONTEXT</text><text x="815" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#253d53" font-family="Arial,Helvetica,sans-serif">PARENT + CHILD CONTEXTS</text><rect x="80" y="125" width="300" height="82" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="230.0" y="155" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Agent context</text><text x="230.0" y="182" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">reason → act → observe</text><rect x="80" y="300" width="300" height="82" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="230.0" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Tool result</text><text x="230.0" y="357" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">feeds the same context</text><path d="M230 207 L230 294" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M80 340 L40 340 L40 165 L74 165" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="56" y="270" text-anchor="start" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">repeat</text><rect x="670" y="105" width="290" height="78" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="815.0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Parent</text><text x="815.0" y="162" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">scope subgoals</text><rect x="525" y="255" width="235" height="90" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="642.5" y="285" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Child A</text><text x="642.5" y="312" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">alert / metrics</text><rect x="835" y="255" width="235" height="90" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="952.5" y="285" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Child B</text><text x="952.5" y="312" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">logs / changes</text><rect x="670" y="417" width="290" height="83" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="815.0" y="447" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Parent joins</text><text x="815.0" y="474" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">verify receipts; answer</text><path d="M740 183 L740 213 L642 213 L642 249" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M890 183 L890 213 L952 213 L952 249" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M642 345 L642 375 L740 375 L740 411" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M952 345 L952 375 L890 375 L890 411" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Fan-out only helps when subgoals are independent; count child work in total cost.</text></svg>
