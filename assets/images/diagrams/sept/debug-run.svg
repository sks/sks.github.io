<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Freeze a run, then find the first divergence</title><desc id="desc">A fixed task and configuration produce a trace. Inspect observation and claim spans side by side, identify the first unsupported step, change one cause, and replay.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Freeze a run, then find the first divergence</text><rect x="45" y="112" width="220" height="85" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="155.0" y="142" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Frozen task</text><text x="155.0" y="169" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">prompt + tools + limits</text><rect x="330" y="112" width="250" height="85" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="455.0" y="142" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Trace export</text><text x="455.0" y="169" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">root + child spans</text><rect x="90" y="302" width="275" height="102" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="227.5" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Observation at step N</text><text x="227.5" y="359" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">tool data / empty / error</text><rect x="435" y="302" width="275" height="102" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="572.5" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Claim at step N</text><text x="572.5" y="359" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">what the agent inferred</text><rect x="800" y="302" width="260" height="102" rx="11" fill="#fce8e6" stroke="#53697c" stroke-width="1.6"/><text x="930.0" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Fix + replay</text><text x="930.0" y="359" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">same task; compare result</text><path d="M265 155 L324 155" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M455 197 L455 244 L227 244 L227 296" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M455 244 L572 244 L572 296" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M365 353 L429 353" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="397" y="336" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">vs</text><path d="M710 353 L794 353" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Do not “fix the prompt” when the failure is in tool or host behavior.</text></svg>
