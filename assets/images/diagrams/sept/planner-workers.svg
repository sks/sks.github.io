<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Route planning and digging separately</title><desc id="desc">The planner chooses probes while tool-calling workers gather observations; a synthesis step must verify evidence. Model routing is per role, not a new execution mode.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b76"/></marker></defs><rect width="1100" height="560" fill="#fffdf9"/><text x="550" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Route planning and digging separately</text><rect x="45" y="182" width="190" height="90" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="140.0" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Task</text><text x="140.0" y="239" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">incident + budget</text><rect x="320" y="105" width="250" height="94" rx="11" fill="#fff0d2" stroke="#53697c" stroke-width="1.6"/><text x="445.0" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Planner seat</text><text x="445.0" y="162" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">reasoning / scoped plan</text><rect x="675" y="91" width="240" height="94" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="795.0" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Dig A • tool_calling</text><text x="795.0" y="148" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">generate + live probes</text><rect x="675" y="231" width="240" height="94" rx="11" fill="#e2f4ec" stroke="#53697c" stroke-width="1.6"/><text x="795.0" y="261" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Dig B • tool_calling</text><text x="795.0" y="288" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">generate + live probes</text><rect x="675" y="399" width="240" height="88" rx="11" fill="#e8f1fb" stroke="#53697c" stroke-width="1.6"/><text x="795.0" y="429" text-anchor="middle" font-size="19" font-weight="700" fill="#15283c" font-family="Arial,Helvetica,sans-serif">Synthesis</text><text x="795.0" y="456" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">receipts → Theory</text><path d="M235 227 L275 227 L275 152 L314 152" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M570 152 L615 152 L615 138 L669 138" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M570 152 L615 152 L615 278 L669 278" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M795 185 L795 203 L645 203 L645 443 L669 443" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M795 325 L795 352 L645 352" fill="none" stroke="#345b76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1005" y="161" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">separate</text><text x="1005" y="187" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">contexts</text><text x="550" y="538" text-anchor="middle" font-size="17" font-weight="400" fill="#253d53" font-family="Arial,Helvetica,sans-serif">Measure all roles together: a cheap dig is not useful if it skips probes.</text></svg>
