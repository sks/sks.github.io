<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Pack evidence around the claim</title>
<desc id="desc">Claim tokens select relevant tool observations within a size budget; exclude how-to text. A complete bag can disprove an absent claim; an incomplete bag cannot.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Pack evidence around the claim</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Truncation is a verifier state, not proof the agent invented a fact.</text><rect x="35" y="140" width="260" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Answer claims</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Extract entity tokens</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">IDs / names / values</text><rect x="352" y="140" width="260" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="370" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Tool results</text><text x="370" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Rank matching chunks</text><text x="370" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">exclude procedure text</text><rect x="669" y="140" width="256" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="687" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Evidence bag</text><text x="687" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Fit budget; record</text><text x="687" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">complete / truncated</text><path d="M297 200 L345 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M614 200 L662 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Verifier decision depends on completeness</text><rect x="139" y="359" width="298" height="116" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="157" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Complete bag</text><text x="157" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Absent claim → flag</text><text x="157" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">unsupported entity</text><rect x="523" y="359" width="298" height="116" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="541" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Truncated bag</text><text x="541" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Absent claim → unknown</text><text x="541" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">alarm on repeated truncation</text><path d="M783 261 V332 H288 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="363" y="345" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">complete</text><path d="M811 261 V332 H672 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="714" y="345" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">incomplete</text>
</svg>
