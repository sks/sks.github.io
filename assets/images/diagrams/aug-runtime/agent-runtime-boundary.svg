<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">The runtime owns the tool loop</title>
<desc id="desc">The platform supplies policy and tenancy; inside a single run, the runtime checks limits, calls the model and tools, manages context and stops with a trace.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">The runtime owns the tool loop</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">A model proposes actions; the runtime controls execution.</text><rect x="35" y="140" width="263" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Platform boundary</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Tenant policy + agent config</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">workflow trigger</text><rect x="349" y="140" width="263" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="367" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Runtime boundary</text><text x="367" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">State + budgets + context</text><text x="367" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">stop / approval checks</text><rect x="663" y="140" width="262" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="681" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Model decision</text><text x="681" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Answer, tool request</text><text x="681" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">or next plan step</text><path d="M300 200 L342 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M614 200 L656 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Tool result returns to the bounded loop</text><rect x="143" y="360" width="298" height="116" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="161" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Tool plane</text><text x="161" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Invoke; handle errors</text><text x="161" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">capture observations</text><rect x="521" y="360" width="298" height="116" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="539" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Outcome + trace</text><text x="539" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Success / stop / HITL</text><text x="539" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">evidence for operator</text><path d="M786 261 V328 H292 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M292 359 V336 H480 V265" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M492 261 V328 H670 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
