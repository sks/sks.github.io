<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Stable prefix, small working context</title>
<desc id="desc">Stable ordered instructions and tool schemas can be reused; volatile evidence travels as references and utility calls do not churn the main prefix.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Stable prefix, small working context</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Cache reuse depends on prompt construction, not just an API flag.</text><rect x="35" y="140" width="264" height="116" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Stable ordered prefix</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Policy + persona</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">tool schemas</text><rect x="348" y="140" width="264" height="116" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="366" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Agent working turn</text><text x="366" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Short evidence refs</text><text x="366" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">new user / tool state</text><rect x="661" y="140" width="264" height="116" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="679" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Model request</text><text x="679" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Reusable prefix</text><text x="679" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">volatile tail</text><path d="M300 198 L341 198" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M613 198 L654 198" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Keep large or one-shot material outside that repeated prefix</text><rect x="95" y="360" width="345" height="116" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="113" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Durable memory</text><text x="113" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Full tool result stored once</text><text x="113" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">fetch only when needed</text><rect x="520" y="360" width="345" height="116" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="538" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Utility call</text><text x="538" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Isolated one-shot prompt</text><text x="538" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">does not rewrite main context</text><path d="M483 257 V331 H268 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M530 257 V331 H693 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
