<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Steer at an iteration boundary</title>
<desc id="desc">Operator feedback waits while the current operation finishes, enters the next reasoning turn, and is acknowledged only after behavior changes. Empty no-op turns are rejected.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Steer at an iteration boundary</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Preserve valid work; do not interrupt an in-flight tool call.</text><rect x="35" y="142" width="260" height="118" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="173" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">In-flight operation</text><text x="53" y="203" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Finish tool call safely</text><text x="53" y="228" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">keep gathered evidence</text><rect x="351" y="142" width="260" height="118" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="369" y="173" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Checkpoint</text><text x="369" y="203" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Read pending steer</text><text x="369" y="228" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">add to active context</text><rect x="667" y="142" width="258" height="118" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="685" y="173" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Next reasoning turn</text><text x="685" y="203" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Apply new constraint</text><text x="685" y="228" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">continue same task</text><path d="M297 201 L344 201" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M613 201 L660 201" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Behavioral checks</text><rect x="143" y="360" width="300" height="115" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="161" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Valid correction</text><text x="161" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Acknowledge quickly</text><text x="161" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">show changed course</text><rect x="520" y="360" width="300" height="115" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="538" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Empty or unsafe</text><text x="538" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Reject no-op; restart if</text><text x="538" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">prior work cannot be trusted</text><path d="M795 261 V334 H293 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="380" y="346" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">applied</text><path d="M825 261 V334 H670 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="710" y="346" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">not applied</text>
</svg>
