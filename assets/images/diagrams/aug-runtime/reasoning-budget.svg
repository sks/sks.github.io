<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Spend reasoning effort where it changes decisions</title>
<desc id="desc">A fixed wall-clock budget is shared by tool collection and synthesis; low-effort collectors preserve turns, while high-effort synthesis still needs the completion gate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Spend reasoning effort where it changes decisions</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">High effort everywhere can time out before a usable close.</text><rect x="35" y="139" width="265" height="122" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Fixed wall clock</text><text x="53" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Tool calls and model hops</text><text x="53" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">share one deadline</text><rect x="348" y="139" width="265" height="122" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="366" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Low collectors</text><text x="366" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Query metrics + logs</text><text x="366" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">preserve tool turns</text><rect x="661" y="139" width="265" height="122" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="679" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">High synthesis</text><text x="679" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Weigh evidence</text><text x="679" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">attempt completion gate</text><path d="M302 200 L341 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M615 200 L654 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Check the execution path as well as the reasoning dial</text><rect x="123" y="360" width="316" height="115" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="141" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Adaptive succeeds if</text><text x="141" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Gate tool is available</text><text x="141" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">and receipts reach parent</text><rect x="520" y="360" width="316" height="115" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="538" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Adaptive can still fail</text><text x="538" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Spawn fan-out or missing</text><text x="538" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">gate burns the clock</text><path d="M792 262 V331 H281 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M813 262 V331 H679 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
