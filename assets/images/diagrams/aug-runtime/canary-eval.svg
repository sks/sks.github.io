<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Canary first, then repeated trials</title>
<desc id="desc">First prove alert discovery, auth, investigate and terminal success with one run. Only after structural checks should expensive judged trials and cross-run concurrence proceed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Canary first, then repeated trials</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Draft RCA text is not a terminal success state.</text><rect x="35" y="139" width="264" height="122" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Alert discovery</text><text x="53" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Find active alert</text><text x="53" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">no alert ≠ green</text><rect x="349" y="139" width="264" height="122" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="367" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">One canary</text><text x="367" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Start fresh; poll until</text><text x="367" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">terminal success</text><rect x="663" y="139" width="262" height="122" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="681" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Structural check</text><text x="681" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Auth, status, fields</text><text x="681" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">fail fast before judging</text><path d="M301 200 L342 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M615 200 L656 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Only after the canary passes</text><rect x="144" y="359" width="296" height="116" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="162" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Repeated runs</text><text x="162" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Fresh investigations</text><text x="162" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">judge each RCA</text><rect x="521" y="359" width="296" height="116" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="539" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Cross-run gate</text><text x="539" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Compare mechanisms</text><text x="539" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">concurrence ≠ correctness</text><path d="M794 262 V331 H292 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M442 418 L514 418" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
