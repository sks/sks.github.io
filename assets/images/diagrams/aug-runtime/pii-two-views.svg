<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">One trace, purpose-bound views</title>
<desc id="desc">Raw values are replaced by stable placeholders for the model and broad logs; only an authorized operator view rehydrates at the presentation boundary.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">One trace, purpose-bound views</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Do not restore protected data into shared history or event buses.</text><rect x="35" y="142" width="265" height="116" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="173" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Tool invocation</text><text x="53" y="203" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Protected argument</text><text x="53" y="228" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">captured in trace</text><rect x="348" y="142" width="265" height="116" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="366" y="173" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Redaction boundary</text><text x="366" y="203" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Stable placeholder ID</text><text x="366" y="228" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">restricted value map</text><rect x="661" y="142" width="265" height="116" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="679" y="173" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Model history</text><text x="679" y="203" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Placeholder only</text><text x="679" y="228" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">no raw value</text><path d="M302 200 L341 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M615 200 L654 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Two destinations after redaction; only one may reveal</text><rect x="95" y="358" width="350" height="118" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="113" y="389" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Broad audit / analytics</text><text x="113" y="419" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Remain redacted</text><text x="113" y="444" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">minimize retention</text><rect x="516" y="358" width="350" height="118" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="534" y="389" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Authorized operator view</text><text x="534" y="419" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Access check → late reveal</text><text x="534" y="444" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">audit the reveal</text><path d="M465 259 V330 H271 V351" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M503 259 V330 H692 V351" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
