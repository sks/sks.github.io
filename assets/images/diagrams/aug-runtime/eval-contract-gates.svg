<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Three distinct evaluation gates</title>
<desc id="desc">Stable case identity, a human-readable rubric, criteria and graders define the contract. Per-run correctness, cross-run concurrence and every-trial reliability can disagree.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Three distinct evaluation gates</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">A mean score cannot replace pass^k on sampled runs.</text><rect x="35" y="139" width="264" height="124" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Case + rubric</text><text x="53" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Stable ID; expected shape</text><text x="53" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">what good looks like</text><rect x="349" y="139" width="264" height="124" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="367" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Criteria + graders</text><text x="367" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Bars separate from prose</text><text x="367" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">structure → model judge</text><rect x="663" y="139" width="262" height="124" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="681" y="170" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Repeated trials</text><text x="681" y="200" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Same case, fresh runs</text><text x="681" y="225" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">record individual results</text><path d="M301 200 L342 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M615 200 L656 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Report gates separately</text><rect x="90" y="359" width="236" height="117" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="108" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Correctness</text><text x="108" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Each run meets</text><text x="108" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">the rubric</text><rect x="362" y="359" width="236" height="117" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="380" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Consistency</text><text x="380" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Runs name the</text><text x="380" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">same mechanism</text><rect x="634" y="359" width="236" height="117" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="652" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Reliability</text><text x="652" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Every sampled run</text><text x="652" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">passes (pass^k)</text><path d="M767 265 V335 H207 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M788 265 V335 H479 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M809 265 V335 H752 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
