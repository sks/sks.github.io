<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Issue to review PR, not auto-merge</title>
<desc id="desc">GitHub gestures trigger a workflow: specify, research and plan leave issue receipts; implementation may open a review PR, but merge and Done remain human-controlled.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Issue to review PR, not auto-merge</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">The module packages the wiring; the hard way configures each resource.</text><rect x="35" y="141" width="262" height="119" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="172" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">GitHub gesture</text><text x="53" y="202" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Issue or card event</text><text x="53" y="227" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">webhook → workflow</text><rect x="349" y="141" width="262" height="119" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="367" y="172" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Aiden runbook</text><text x="367" y="202" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Specify → Research</text><text x="367" y="227" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Plan with issue receipts</text><rect x="663" y="141" width="262" height="119" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="681" y="172" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Optional implement</text><text x="681" y="202" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Open review PR</text><text x="681" y="227" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">no auto-merge</text><path d="M299 200 L342 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M613 200 L656 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Separate trigger and approval boundary</text><rect x="139" y="360" width="300" height="116" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="157" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Human review</text><text x="157" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Inspect issue, board</text><text x="157" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">and PR before merge</text><rect x="524" y="360" width="300" height="116" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="542" y="391" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">After merge event</text><text x="542" y="421" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Comment receipt</text><text x="542" y="446" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">move card to Done</text><path d="M794 261 V330 H289 V353" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M440 418 L517 418" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="454" y="402" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">merge</text>
</svg>
