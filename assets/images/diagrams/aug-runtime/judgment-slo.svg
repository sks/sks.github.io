<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Availability is not judgment</title>
<desc id="desc">A healthy HTTP response can conceal a bad decision; historical scorecards and a live judge test different paths, with human review for low-confidence actions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Availability is not judgment</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Operational SLOs and decision-quality SLOs need separate signals.</text><rect x="35" y="141" width="270" height="119" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="172" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Agent decision</text><text x="53" y="202" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Triage or proposed action</text><text x="53" y="227" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">HTTP 200 can still be wrong</text><rect x="347" y="141" width="270" height="119" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="365" y="172" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Live execution judge</text><text x="365" y="202" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Trace vs organizational</text><text x="365" y="227" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">rubric for high-stakes action</text><rect x="659" y="141" width="267" height="119" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="677" y="172" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Threshold</text><text x="677" y="202" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Confidence below bar?</text><text x="677" y="227" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">pause for human review</text><path d="M307 200 L340 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M619 200 L652 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Independent regression signal, alongside uptime / latency</text><rect x="140" y="357" width="294" height="120" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="158" y="388" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Nightly scorecards</text><text x="158" y="418" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Historical incidents</text><text x="158" y="443" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">compare decision paths</text><rect x="526" y="357" width="294" height="120" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="544" y="388" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Judgment SLO</text><text x="544" y="418" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Track quality and</text><text x="544" y="443" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">escalation-rate drift</text><path d="M480 261 V332 H287 V350" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M789 261 V332 H673 V350" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
