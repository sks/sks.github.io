<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Keep benchmark axes separate</title>
<desc id="desc">Measure execution shape and evidence middleware as separate matched pairs; both require wall time, tools, bytes, tokens and answer quality, with HITL waits recorded.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Keep benchmark axes separate</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">An invalid PII/tool configuration is not a middleware comparison.</text><rect x="35" y="140" width="268" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Axis A: orchestration</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Parent-first vs tree</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">same single-plane job</text><rect x="346" y="140" width="268" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="364" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Axis B: evidence</text><text x="364" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Pass-through vs rewrite</text><text x="364" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">same Node Not Ready job</text><rect x="657" y="140" width="268" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="675" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Validity check</text><text x="675" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Matched budgets / allowlists</text><text x="675" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">PII path + approvals</text><path d="M305 200 L339 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M616 200 L650 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Report both axes with the same scorecard, not one blended winner</text><rect x="109" y="359" width="338" height="115" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="127" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Cost and data path</text><text x="127" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Wall time; tool starts</text><text x="127" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">payload bytes; tokens</text><rect x="512" y="359" width="338" height="115" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="530" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Outcome and delays</text><text x="530" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Theory quality; HITL waits</text><text x="530" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">flag invalid pairs</text><path d="M478 261 V330 H278 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M787 261 V330 H681 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
