<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">One loop or a planner tree?</title>
<desc id="desc">For a narrow single-plane triage, a parent loop calls tools directly. A planner tree adds child handoffs and coordination; use it when independent specialist digs justify the tax.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">One loop or a planner tree?</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Compare execution shape under matched tools and budgets.</text><rect x="35" y="140" width="280" height="125" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Parent-first</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">One cognitive loop</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">root calls tools directly</text><rect x="339" y="140" width="280" height="125" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="357" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Same triage task</text><text x="357" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Read-only cluster health</text><text x="357" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">same tool and time budget</text><rect x="643" y="140" width="280" height="125" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="661" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Planner tree</text><text x="661" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Root delegates to children</text><text x="661" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">root integrates results</text><path d="M339 188 L319 188" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M620 217 L637 217" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Choose by branching need, not agent count as a fashion signal</text><rect x="107" y="359" width="330" height="116" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="125" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Single-plane dig</text><text x="125" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Fewer coordination hops</text><text x="125" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">measure wall time + calls</text><rect x="522" y="359" width="330" height="116" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="540" y="390" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Multi-plane dig</text><text x="540" y="420" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Parallel specialist context</text><text x="540" y="445" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">measure isolation + tax</text><path d="M173 266 V337 H272 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M784 266 V337 H687 V352" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
