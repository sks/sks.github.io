<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Stop the loop, keep the answer</title>
<desc id="desc">A repetition stop checks the best earlier substantive candidate, but only delivers it if a required evidence gate has passed. Otherwise the runtime reports the incomplete run.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Stop the loop, keep the answer</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Execution health and answer quality are separate decisions.</text><rect x="35" y="140" width="255" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Agent turns</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Evidence-backed answer</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">then repeated closings</text><rect x="353" y="140" width="255" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="371" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Loop detector</text><text x="371" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Repetition threshold</text><text x="371" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">halts more turns</text><rect x="670" y="140" width="255" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="688" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Candidate store</text><text x="688" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Keep best substantive</text><text x="688" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">earlier answer</text><path d="M291 200 L346 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M609 200 L663 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">On halt: test the completion requirement before delivery</text><rect x="167" y="366" width="270" height="112" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="185" y="397" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Gate passed</text><text x="185" y="427" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Deliver saved answer</text><text x="185" y="452" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">with stopped status</text><rect x="522" y="366" width="270" height="112" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="540" y="397" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Gate missing</text><text x="540" y="427" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Do not salvage</text><text x="540" y="452" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">report incomplete</text><path d="M795 261 V337 H302 V358" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="405" y="349" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">yes</text><path d="M815 261 V337 H657 V358" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="698" y="349" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">no</text>
</svg>
