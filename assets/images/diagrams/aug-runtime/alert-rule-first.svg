<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Measure the firing expression first</title>
<desc id="desc">An alert title is only a label; fetch the stored expression, identify its backend and time range, run it, then branch to targeted digs. Do not invent PromQL from the title.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#225a86"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="36" y="46" fill="#10263d" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">Measure the firing expression first</text>
<text x="36" y="82" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Identity of the signal comes before a root-cause theory.</text><rect x="35" y="140" width="260" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="53" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Alert label</text><text x="53" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">May say “latency”</text><text x="53" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">not a query definition</text><rect x="352" y="140" width="260" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="370" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Stored rule</text><text x="370" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Fetch expression</text><text x="370" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">backend + time range</text><rect x="669" y="140" width="256" height="120" rx="16" fill="#edf5fc" stroke="#7997b5" stroke-width="2"/><text x="687" y="171" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Measure it</text><text x="687" y="201" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Run the real query</text><text x="687" y="226" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">keep result as evidence</text><path d="M297 200 L345 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M614 200 L662 200" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M36 302 H924" stroke="#b8cadb" stroke-width="2" stroke-dasharray="7 7"/><text x="38" y="327" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Only then choose a data plane</text><rect x="138" y="358" width="298" height="120" rx="16" fill="#e9f7f2" stroke="#7997b5" stroke-width="2"/><text x="156" y="389" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Metrics / logs</text><text x="156" y="419" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">If rule points there</text><text x="156" y="444" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">dig on measured locus</text><rect x="523" y="358" width="298" height="120" rx="16" fill="#fff3e9" stroke="#7997b5" stroke-width="2"/><text x="541" y="389" fill="#12345a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Warehouse / other</text><text x="541" y="419" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">If rule points there</text><text x="541" y="444" fill="#14283f" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">avoid invented PromQL</text><path d="M785 261 V330 H287 V351" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M806 261 V330 H672 V351" stroke="#225a86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
