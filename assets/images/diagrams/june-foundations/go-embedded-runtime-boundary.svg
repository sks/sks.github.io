<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Why a Go runtime fit the Go host</title>
<desc id="desc">The Go host imports the agent runtime into one process. A separate Python runtime would add a cross-process API, serialization, deployment and failure boundary; both can call a model provider over HTTP.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#174a69"/></marker></defs>
<rect width="960" height="500" fill="#fbfcfa"/>
<text x="36" y="42" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#182b3a" text-anchor="start">Why a Go runtime fit the Go host</text>
<text x="34" y="98" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#174a69" text-anchor="start">Chosen: library in the existing platform process</text>
<rect x="28" y="121" width="904" height="142" rx="16" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<rect x="47" y="151" width="242" height="80" rx="12" fill="#ffffff" stroke="#174a69" stroke-width="2"/>
<text x="168.0" y="184.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Aiden / Temporal</text>
<text x="168.0" y="209.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">Go host</text>
<rect x="379" y="151" width="250" height="80" rx="12" fill="#ffffff" stroke="#174a69" stroke-width="2"/>
<text x="504.0" y="184.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Go agent runtime</text>
<text x="504.0" y="209.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">library import</text>
<rect x="714" y="151" width="195" height="80" rx="12" fill="#ffffff" stroke="#174a69" stroke-width="2"/>
<text x="811.5" y="184.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Tool policy</text>
<text x="811.5" y="209.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">and execution</text>
<polyline points="289,191 369,191" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="629,191 704,191" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="34" y="318" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#7b3e31" text-anchor="start">Alternative: companion Python runtime</text>
<rect x="47" y="341" width="242" height="85" rx="12" fill="#fff0eb" stroke="#935646" stroke-width="2"/>
<text x="168.0" y="377.0" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Go platform</text>
<text x="168.0" y="402.0" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">host process</text>
<rect x="379" y="341" width="250" height="85" rx="12" fill="#fff3df" stroke="#926013" stroke-width="2"/>
<text x="504.0" y="377.0" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#182b3a" text-anchor="middle">Cross-process API</text>
<text x="504.0" y="402.0" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#182b3a" text-anchor="middle">serialize + handle failure</text>
<rect x="714" y="341" width="195" height="85" rx="12" fill="#fff0eb" stroke="#935646" stroke-width="2"/>
<text x="811.5" y="377.0" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Python runtime</text>
<text x="811.5" y="402.0" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">separate deployment</text>
<polyline points="289,384 369,384" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="629,384 704,384" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="480" y="474" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#182b3a" text-anchor="middle">The extra boundary—not a blanket language-speed claim—drives this choice.</text>
</svg>
