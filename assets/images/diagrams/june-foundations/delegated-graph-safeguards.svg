<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Delegated parallel work needs graph and safety boundaries</title>
<desc id="desc">The parent fans out to isolated child sessions, then joins results. Each child tool path passes through governance; each step has its own deadline under an overall plan ceiling. Child tool sets do not include delegation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#174a69"/></marker></defs>
<rect width="960" height="500" fill="#fbfcfa"/>
<text x="36" y="42" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#182b3a" text-anchor="start">Delegated parallel work needs graph and safety boundaries</text>
<rect x="31" y="189" width="154" height="95" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="108.0" y="230.0" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Parent task</text>
<text x="108.0" y="255.0" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">overall ceiling</text>
<rect x="277" y="189" width="151" height="95" rx="12" fill="#fff3df" stroke="#926013" stroke-width="2"/>
<text x="352.5" y="230.0" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Fan out</text>
<text x="352.5" y="255.0" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">parallel plan</text>
<rect x="516" y="92" width="200" height="104" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="616.0" y="137.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Child A session</text>
<text x="616.0" y="162.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">own state + deadline</text>
<rect x="516" y="299" width="200" height="104" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="616.0" y="344.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Child B session</text>
<text x="616.0" y="369.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">own state + deadline</text>
<rect x="789" y="189" width="141" height="95" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="859.5" y="230.0" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Join results</text>
<text x="859.5" y="255.0" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">parent uses</text>
<polyline points="185,236 267,236" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="428,215 461,215 461,144 506,144" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="428,260 461,260 461,351 506,351" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="716,144 760,144 760,218 779,218" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="716,351 760,351 760,258 779,258" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="480" y="456" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#182b3a" text-anchor="middle">For every child tool call: same governance wrapper; no delegation tool in child set.</text>
</svg>
