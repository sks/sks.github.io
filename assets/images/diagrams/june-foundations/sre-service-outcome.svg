<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">From SRE output to service outcome</title>
<desc id="desc">The engineering-centered route counts a shipped framework despite repeat full digs. The service route checks an existing result and changed evidence to produce a useful on-call handoff.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#174a69"/></marker></defs>
<rect width="960" height="500" fill="#fbfcfa"/>
<text x="36" y="42" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#182b3a" text-anchor="start">From SRE output to service outcome</text>
<text x="38" y="95" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#40586a" text-anchor="start">What is rewarded changes what gets shipped</text>
<text x="40" y="164" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#7b3e31" text-anchor="start">BUILD-FIRST</text>
<rect x="200" y="124" width="192" height="80" rx="12" fill="#fff0eb" stroke="#935646" stroke-width="2"/>
<text x="296.0" y="157.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Framework</text>
<text x="296.0" y="182.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">shipped</text>
<rect x="457" y="124" width="192" height="80" rx="12" fill="#fff0eb" stroke="#935646" stroke-width="2"/>
<text x="553.0" y="157.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Each follow-up</text>
<text x="553.0" y="182.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">starts full dig</text>
<rect x="714" y="124" width="206" height="80" rx="12" fill="#fff0eb" stroke="#935646" stroke-width="2"/>
<text x="817.0" y="157.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Repeat waits</text>
<text x="817.0" y="182.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">on same alert</text>
<polyline points="392,164 447,164" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="649,164 704,164" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="40" y="301" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#174a69" text-anchor="start">SERVICE-FIRST</text>
<rect x="200" y="254" width="192" height="92" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="296.0" y="293.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Check prior RCA</text>
<text x="296.0" y="318.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">and evidence</text>
<rect x="457" y="254" width="192" height="92" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="553.0" y="293.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Reuse if relevant</text>
<text x="553.0" y="318.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">fresh if changed</text>
<rect x="714" y="254" width="206" height="92" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="817.0" y="293.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Useful handoff</text>
<text x="817.0" y="318.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">for on-call</text>
<polyline points="392,300 447,300" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="649,300 704,300" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<line x1="38" y1="390" x2="922" y2="390" stroke="#718593" stroke-width="2"/>
<text x="480" y="426" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#182b3a" text-anchor="middle">Measure investigations per alert and time to a useful answer—not only artifacts shipped.</text>
</svg>
