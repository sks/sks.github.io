<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">A triage card is a route to evidence</title>
<desc id="desc">The Slack card carries counts, alert identity, findings and uncertainty. Its watch link opens detailed evidence; Activity supports authorized search by initiator and thread metadata.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#174a69"/></marker></defs>
<rect width="960" height="500" fill="#fbfcfa"/>
<text x="36" y="42" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#182b3a" text-anchor="start">A triage card is a route to evidence</text>
<rect x="31" y="170" width="193" height="114" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="127.5" y="220.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Investigation</text>
<text x="127.5" y="245.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">findings + status</text>
<rect x="295" y="91" width="339" height="244" rx="12" fill="#eaf5ed" stroke="#286443" stroke-width="2"/>
<text x="464.5" y="181.5" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#182b3a" text-anchor="middle">Slack triage card</text>
<text x="464.5" y="206.5" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#182b3a" text-anchor="middle">Counts + numbered alerts</text>
<text x="464.5" y="231.5" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#182b3a" text-anchor="middle">Finding / what is unknown</text>
<text x="464.5" y="256.5" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#182b3a" text-anchor="middle">Next action + watch link</text>
<rect x="711" y="92" width="218" height="106" rx="12" fill="#eef5f8" stroke="#174a69" stroke-width="2"/>
<text x="820.0" y="138.5" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#182b3a" text-anchor="middle">Watch / session</text>
<text x="820.0" y="163.5" font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#182b3a" text-anchor="middle">detailed evidence</text>
<rect x="711" y="280" width="218" height="106" rx="12" fill="#fff3df" stroke="#926013" stroke-width="2"/>
<text x="820.0" y="314.0" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#182b3a" text-anchor="middle">Activity</text>
<text x="820.0" y="339.0" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#182b3a" text-anchor="middle">initiator + thread</text>
<text x="820.0" y="364.0" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#182b3a" text-anchor="middle">authorized search</text>
<polyline points="224,227 285,227" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="634,163 701,145" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="634,265 660,265 660,333 701,333" fill="none" stroke="#174a69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="666" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#182b3a" text-anchor="start">open</text>
<text x="650" y="299" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#182b3a" text-anchor="start">find later</text>
<line x1="32" y1="419" x2="928" y2="419" stroke="#718593" stroke-width="2"/>
<text x="480" y="450" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#182b3a" text-anchor="middle">Keep raw logs in the evidence view, not the broadly visible channel.</text>
</svg>
