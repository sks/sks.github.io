<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Content-Addressed Storage in ClickHouse: The Four Object Kinds and Git Analogy</title>
  <desc id="desc">How Altinity Antalya CAS stores MergeTree parts in S3 using four object kinds modeled on Git: content-hashed Blobs, immutable part Manifests, append-only Ref Logs, and epoch-fenced Mount Leases driving an 18-phase reachability garbage collector.</desc>
  <defs>
    <marker id="arr-om" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#1e4e68"/>
    </marker>
    <marker id="arr-omg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#1f6f50"/>
    </marker>
  </defs>

  <rect width="1080" height="600" fill="#fffdf8"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#17283c">
    <text x="540" y="36" text-anchor="middle" font-size="22" font-weight="700">Content-Addressed Storage (CAS): Git Semantics for ClickHouse Parts on S3</text>
    <text x="540" y="60" text-anchor="middle" font-size="14" fill="#465a6e">Four self-describing object kinds in S3 replace mutable reference counters with fail-closed reachability</text>

    <!-- S3 POOL CONTAINER -->
    <rect x="28" y="80" width="1024" height="444" rx="14" fill="#eef4fb" stroke="#28597a" stroke-width="2"/>
    <rect x="48" y="96" width="460" height="28" rx="6" fill="#17283c"/>
    <text x="278" y="115" text-anchor="middle" font-family="Courier, monospace" font-size="13" font-weight="700" fill="#ffffff">S3 Pool Prefix: s3://bucket/cas/&lt;tenant&gt;/</text>
    <text x="526" y="115" font-size="13" font-weight="700" fill="#143852">Keeper stays out of the blob path &#8212; all CAS state lives in S3</text>

    <!-- OBJECT 1: REF LOG (GIT REF) -->
    <rect x="48" y="140" width="296" height="170" rx="10" fill="#ffffff" stroke="#9b6b24" stroke-width="1.8"/>
    <rect x="48" y="140" width="296" height="34" rx="10" fill="#9b6b24"/>
    <text x="196" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. Ref Log (= Git Branch Ref)</text>
    <text x="196" y="188" text-anchor="middle" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#5e3e0e">cas/ns/stream/.../_log/*</text>
    <text x="196" y="210" text-anchor="middle" font-size="12" fill="#5e3e0e">The ONLY mutable logical state:</text>
    <text x="196" y="230" text-anchor="middle" font-size="11" fill="#465a6e">Append-only records mapping</text>
    <text x="196" y="248" text-anchor="middle" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#17283c">part_name &#8594; manifest_id (+1 / &#8722;1)</text>
    <text x="196" y="272" text-anchor="middle" font-size="11" fill="#7a541b">Checkpointed via folded snapshots</text>
    <text x="196" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#9b6b24">Never mutates blobs in place</text>

    <path d="M344 225 H386" fill="none" stroke="#1e4e68" stroke-width="2.4" marker-end="url(#arr-om)"/>
    <text x="365" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#1e4e68">names</text>

    <!-- OBJECT 2: MANIFEST (GIT TREE) -->
    <rect x="390" y="140" width="300" height="170" rx="10" fill="#ffffff" stroke="#28597a" stroke-width="1.8"/>
    <rect x="390" y="140" width="300" height="34" rx="10" fill="#28597a"/>
    <text x="540" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. Part Manifest (= Git Tree)</text>
    <text x="540" y="188" text-anchor="middle" font-family="Courier, monospace" font-size="10" font-weight="700" fill="#143852">cas/manifests/&lt;root&gt;/&lt;epoch&gt;-&lt;seq&gt;</text>
    <text x="540" y="210" text-anchor="middle" font-size="12" fill="#334a60">Immutable sorted inventory of one</text>
    <text x="540" y="228" text-anchor="middle" font-size="12" fill="#334a60">MergeTree part's files:</text>
    <rect x="410" y="238" width="260" height="44" rx="6" fill="#eef4fb"/>
    <text x="540" y="256" text-anchor="middle" font-family="Courier, monospace" font-size="10">data.bin &#8594; hash=8f3a.. size=4MB</text>
    <text x="540" y="272" text-anchor="middle" font-family="Courier, monospace" font-size="10">primary.idx &#8594; hash=2c91.. size=8KB</text>
    <text x="540" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#1f6f50">Peer fetch = read manifest, link blobs</text>

    <path d="M690 225 H732" fill="none" stroke="#1f6f50" stroke-width="2.4" marker-end="url(#arr-omg)"/>
    <text x="711" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#1f6f50">points to</text>

    <!-- OBJECT 3: BLOBS (GIT BLOB) -->
    <rect x="736" y="140" width="296" height="170" rx="10" fill="#ffffff" stroke="#1f6f50" stroke-width="1.8"/>
    <rect x="736" y="140" width="296" height="34" rx="10" fill="#1f6f50"/>
    <text x="884" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Content Blobs (= Git Blob)</text>
    <text x="884" y="188" text-anchor="middle" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#164231">blobs/cityhash128/&lt;hex[0:2]&gt;/&lt;hex&gt;</text>
    <text x="884" y="210" text-anchor="middle" font-size="12" fill="#2c4a3e">Write-once raw column &amp; index bytes</text>
    <text x="884" y="228" text-anchor="middle" font-size="12" fill="#2c4a3e">addressed by cryptographic/128b hash.</text>
    <rect x="756" y="240" width="256" height="38" rx="6" fill="#dff0e8"/>
    <text x="884" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#164231">Identical bytes = identical S3 key</text>
    <text x="884" y="272" text-anchor="middle" font-size="10" fill="#1f6f50">Free deduplication across all replicas</text>
    <text x="884" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#164231">No per-replica ownership table</text>

    <!-- OBJECT 4: MOUNT LEASE + 18-PHASE GC -->
    <rect x="48" y="330" width="984" height="174" rx="12" fill="#ffffff" stroke="#5b4b8a" stroke-width="1.8"/>
    <rect x="48" y="330" width="984" height="34" rx="12" fill="#5b4b8a"/>
    <text x="540" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4. Mount Leases &amp; 18-Phase Reachability Garbage Collection (= git gc for Multi-Writer S3)</text>

    <rect x="68" y="378" width="296" height="110" rx="8" fill="#f3f0fb" stroke="#5b4b8a" stroke-width="1.3"/>
    <text x="216" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#3a2e5c">Server Root &amp; Epoch Lease</text>
    <text x="216" y="420" text-anchor="middle" font-family="Courier, monospace" font-size="10" fill="#5b4b8a">gc/server-roots/&lt;id&gt;/{owner,epoch,mount}</text>
    <text x="216" y="440" text-anchor="middle" font-size="11" fill="#3a2e5c">Keyed by <tspan font-family="Courier, monospace" font-weight="700">cas_server_root_id</tspan> (<tspan font-family="Courier, monospace">{replica}</tspan>),</text>
    <text x="216" y="456" text-anchor="middle" font-size="11" fill="#3a2e5c">never random ServerUUID. Fences</text>
    <text x="216" y="472" text-anchor="middle" font-size="11" fill="#3a2e5c">stale writers when epoch advances.</text>

    <rect x="392" y="378" width="296" height="110" rx="8" fill="#eef8f3" stroke="#1f6f50" stroke-width="1.3"/>
    <text x="540" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#164231">Reachability Fold (Not Counters)</text>
    <text x="540" y="422" text-anchor="middle" font-size="11" fill="#2c4a3e">GC leader folds append-only ref logs</text>
    <text x="540" y="440" text-anchor="middle" font-size="11" fill="#2c4a3e">across all active server roots into</text>
    <text x="540" y="458" text-anchor="middle" font-size="11" fill="#2c4a3e">an in-degree map; deletes only blobs</text>
    <text x="540" y="474" text-anchor="middle" font-size="11" font-weight="700" fill="#1f6f50">proven to have in-degree == 0.</text>

    <rect x="716" y="378" width="296" height="110" rx="8" fill="#fff8eb" stroke="#9b6b24" stroke-width="1.3"/>
    <text x="864" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#5e3e0e">Fail-Closed Safety Rule</text>
    <text x="864" y="422" text-anchor="middle" font-size="11" fill="#5e3e0e">Expired lease? Unreadable manifest?</text>
    <text x="864" y="440" text-anchor="middle" font-size="11" fill="#5e3e0e">Concurrent write in flight?</text>
    <text x="864" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#9b6b24">&#8594; GC keeps the blob and defers.</text>
    <text x="864" y="474" text-anchor="middle" font-size="11" fill="#5e3e0e">Never guesses on deletion.</text>

    <!-- FOOTER -->
    <rect x="28" y="540" width="1024" height="42" rx="8" fill="#17283c"/>
    <text x="540" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Why CAS Succeeds Where Zero-Copy Failed: Identity lives in the content hash, and deletion requires global reachability proof</text>
  </g>
</svg>
