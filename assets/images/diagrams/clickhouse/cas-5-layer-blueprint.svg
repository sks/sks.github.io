<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" role="img" aria-labelledby="bpTitle bpDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="bpTitle">5-Layer Self-Managed ClickHouse Blueprint with Single-Flag CAS</title>
  <desc id="bpDesc">Dark-mode 5-layer architecture flow diagram showing directional network and storage boundaries: Layer 1 ephemeral ASG compute with chinit deterministic 36-byte UUIDs and HTTP /replicas_status NLB gating, Layer 2 500 MB/s gp3 hot merge consolidator, Layer 3 NVMe RAID-0 / 64 GiB cache tier, Layer 4 1x shared content-addressed S3 pool over a free regional S3 Gateway Endpoint, and Layer 5 isolated versioned DR backups via on-demand backup-0.</desc>

  <defs>
    <linearGradient id="bpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <marker id="bpGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="bpCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="bpPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="bpPink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#f472b6"/>
    </marker>
    <marker id="bpAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1560" height="820" rx="14" fill="url(#bpBg)"/>

  <text x="780" y="38" text-anchor="middle" fill="#f8fafc" font-size="21.5" font-weight="800">The 5-Layer Self-Managed ClickHouse Blueprint (<tspan fill="#34d399" font-family="monospace">cas_config.enabled</tspan> Single-Flag Toggle)</text>
  <text x="780" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Explicit network boundaries: <tspan fill="#c084fc" font-weight="700">S3Queue Ingest</tspan> · <tspan fill="#f472b6" font-weight="700">Hot TCP :9010</tspan> · <tspan fill="#34d399" font-weight="700">$0/GB S3 Gateway Endpoint (1× CAS Pool)</tspan> · <tspan fill="#fbbf24" font-weight="700">Isolated Nightly DR</tspan></text>

  <!-- TOP INGRESS BAR -->
  <g transform="translate(26, 78)">
    <rect x="0" y="0" width="490" height="66" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.4"/>
    <text x="245" y="23" text-anchor="middle" fill="#e9d5ff" font-size="12.5" font-weight="700">Staged S3Queue Ingest (Writers Only)</text>
    <text x="245" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-family="monospace">200 MB NDJSON · shared keeper_path · hash_ring_filtering=1</text>
    <text x="245" y="57" text-anchor="middle" fill="#4ade80" font-size="10">chinit drops S3Queue immediately on readers &amp; backup-0</text>

    <rect x="515" y="0" width="510" height="66" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="770" y="23" text-anchor="middle" fill="#bae6fd" font-size="12.5" font-weight="700">Readers &amp; Writers NLBs (TLS :8443 / :9440)</text>
    <text x="770" y="42" text-anchor="middle" fill="#4ade80" font-size="10.5" font-family="monospace">Health Gate: HTTP :8123/replicas_status (delay ≤ 300s)</text>
    <text x="770" y="57" text-anchor="middle" fill="#cbd5e1" font-size="10">deregistration_delay = 30s · Holds queries off lagging scale-outs</text>

    <rect x="1050" y="0" width="458" height="66" rx="8" fill="#271206" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="1279" y="23" text-anchor="middle" fill="#fde68a" font-size="12.5" font-weight="700">3× Keeper Quorum (:9181) + Lease Table</text>
    <text x="1279" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-family="monospace">Dedicated Raft gp3 · Static IPs · AMI decoupled</text>
    <text x="1279" y="57" text-anchor="middle" fill="#34d399" font-size="10">Zero CAS znodes in Keeper (manifests &amp; GC live in S3)</text>
  </g>

  <!-- Ingress Arrows -->
  <path d="M 271 144 L 271 174" stroke="#c084fc" stroke-width="2.5" marker-end="url(#bpPurple)"/>
  <path d="M 796 144 L 796 174" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#bpCyan)"/>
  <path d="M 1305 144 L 1305 174" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#bpAmber)"/>

  <!-- LAYER 1: COMPUTE -->
  <g transform="translate(26, 178)">
    <rect width="1508" height="142" rx="10" fill="#111827" stroke="#6366f1" stroke-width="1.8"/>
    <rect width="1508" height="26" rx="10" fill="#312e81"/>
    <text x="16" y="18" fill="#e0e7ff" font-size="12" font-weight="800">LAYER 1 — EPHEMERAL ROLE-SPLIT COMPUTE + DETERMINISTIC 36-BYTE IDENTITY (chinit v0.2.3+)</text>

    <!-- Writers -->
    <rect x="16" y="36" width="474" height="94" rx="7" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.4"/>
    <text x="28" y="56" fill="#e9d5ff" font-size="12" font-weight="800">Writers ASG (On-Demand · m8g.2xlarge → m8g.4xlarge)</text>
    <text x="28" y="74" fill="#cbd5e1" font-size="10.5">• Sizing law: <tspan font-family="monospace" fill="#fde68a">vCPUs = (raw MB/s ÷ 8.8) × 2</tspan> (50% merge headroom)</text>
    <text x="28" y="92" fill="#cbd5e1" font-size="10.5">• Exact 36B <tspan font-family="monospace" fill="#6ee7b7">/var/lib/clickhouse/uuid</tspan> + <tspan font-family="monospace" fill="#6ee7b7">CH_CAS_SERVER_ROOT_ID</tspan></text>
    <text x="28" y="110" fill="#94a3b8" font-size="10" font-family="monospace">cas_unsafe_remount_no_delay=true → 7s restart, clean fresh-EBS rolls</text>

    <!-- Hot :9010 Connector between Writers & Readers -->
    <path d="M 492 83 L 552 83" stroke="#f472b6" stroke-width="2.6" marker-start="url(#bpPink)" marker-end="url(#bpPink)"/>
    <rect x="494" y="53" width="56" height="20" rx="4" fill="#500724" stroke="#f472b6" stroke-width="1"/>
    <text x="522" y="67" text-anchor="middle" fill="#fbcfe8" font-size="9.5" font-weight="700" font-family="monospace">:9010</text>
    <text x="522" y="102" text-anchor="middle" fill="#f9a8d4" font-size="9">Hot parts</text>

    <!-- Readers -->
    <rect x="554" y="36" width="474" height="94" rx="7" fill="#082f49" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="566" y="56" fill="#bae6fd" font-size="12" font-weight="800">Readers ASG (Spot / Multi-Family · c8g.xlarge, Scale 1..N)</text>
    <text x="566" y="74" fill="#cbd5e1" font-size="10.5">• <tspan font-family="monospace" fill="#fde68a">prefer_fetch_merged_part = 180s / 1 MiB</tspan> (fetches big merges)</text>
    <text x="566" y="92" fill="#cbd5e1" font-size="10.5">• <tspan font-family="monospace" fill="#fde68a">execute_merges_on_single_replica = 0</tspan> on hot tier</text>
    <text x="566" y="110" fill="#34d399" font-size="10" font-family="monospace">Spans Single-AZ ($0/GB) or 3 AZs when cas_config.enabled = true</text>

    <!-- Backup-0 -->
    <rect x="1048" y="36" width="444" height="94" rx="7" fill="#052e16" stroke="#10b981" stroke-width="1.4"/>
    <text x="1060" y="56" fill="#6ee7b7" font-size="12" font-weight="800">On-Demand backup-0 (0↔1 Nightly Lifecycle)</text>
    <text x="1060" y="74" fill="#cbd5e1" font-size="10.5">• Stopped ~23.5h/day (~$1.50/mo EC2 compute)</text>
    <text x="1060" y="92" fill="#cbd5e1" font-size="10.5">• Wakes @ 02:00 UTC → syncs catalog &amp; CAS → archives</text>
    <text x="1060" y="110" fill="#fbbf24" font-size="10" font-family="monospace">Excluded from NLBs, S3Queue, and insert quorum</text>
  </g>

  <!-- Arrows L1 -> L2 -->
  <path d="M 255 320 L 255 352" stroke="#c084fc" stroke-width="2.5" marker-end="url(#bpPurple)"/>
  <path d="M 790 320 L 790 352" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#bpCyan)"/>

  <!-- LAYER 2 & LAYER 3 SIDE-BY-SIDE ON NODE -->
  <g transform="translate(26, 356)">
    <!-- Layer 2: Hot Scratch -->
    <rect x="0" y="0" width="738" height="126" rx="10" fill="#171625" stroke="#f59e0b" stroke-width="1.7"/>
    <rect x="0" y="0" width="738" height="26" rx="10" fill="#78350f"/>
    <text x="16" y="18" fill="#fef3c7" font-size="12" font-weight="800">LAYER 2 — HOT SCRATCH MERGE CONSOLIDATOR (LOCAL EBS gp3)</text>
    <text x="20" y="50" fill="#f8fafc" font-size="12" font-weight="700" font-family="monospace">256–384 GiB gp3 @ 500 MB/s, 4,000 IOPS (+$20/mo/writer)</text>
    <text x="20" y="72" fill="#cbd5e1" font-size="11">• Absorbs live inserts + synchronous summary MVs at 0.38% disk iowait</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="11">• <tspan font-family="monospace" fill="#fde68a">min_bytes_for_wide_part = 1 GiB</tspan> + <tspan font-family="monospace" fill="#fde68a">max_parts_to_merge_at_once = 100</tspan></text>
    <text x="20" y="111" fill="#34d399" font-size="10.5" font-weight="600">Consolidates parts locally ONCE before async TTL move (1–2d) to cold CAS</text>

    <!-- Arrow L2 -> L3 -->
    <path d="M 740 63 L 768 63" stroke="#fbbf24" stroke-width="2.8" marker-end="url(#bpAmber)"/>

    <!-- Layer 3: Local Cache -->
    <rect x="770" y="0" width="738" height="126" rx="10" fill="#0c1f2e" stroke="#38bdf8" stroke-width="1.7"/>
    <rect x="770" y="0" width="738" height="26" rx="10" fill="#0369a1"/>
    <text x="786" y="18" fill="#e0f2fe" font-size="12" font-weight="800">LAYER 3 — HARDWARE-SIZED READ / WRITE CACHE (cas_cache)</text>
    <text x="790" y="50" fill="#f8fafc" font-size="12" font-weight="700" font-family="monospace">Ephemeral NVMe RAID-0 (90% auto-sized) or ≥64 GiB gp3</text>
    <text x="790" y="72" fill="#cbd5e1" font-size="11">• Sized for ≥14 GiB per active cache wrapper during policy migration</text>
    <text x="790" y="92" fill="#cbd5e1" font-size="11">• Caches recently moved cold parts &amp; hot query column ranges locally</text>
    <text x="790" y="111" fill="#7dd3fc" font-size="10.5" font-weight="600">Disposed cleanly on Spot reclaim — zero durable state stored on cache disk</text>
  </g>

  <!-- NETWORK BOUNDARY DIVIDER: S3 GATEWAY ENDPOINT -->
  <line x1="26" y1="518" x2="1534" y2="518" stroke="#10b981" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="445" y="504" width="670" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="523" text-anchor="middle" fill="#ecfdf5" font-size="12" font-weight="800" font-family="monospace">VPC REGIONAL S3 GATEWAY ENDPOINT — $0.00/hr · $0.00/GB ACROSS ALL AZs</text>

  <!-- Directional Arrows Across S3 Gateway Endpoint -->
  <path d="M 380 482 L 380 562" stroke="#34d399" stroke-width="3.2" marker-end="url(#bpGreen)"/>
  <rect x="255" y="534" width="250" height="20" rx="4" fill="#052e16" stroke="#34d399" stroke-width="1"/>
  <text x="380" y="548" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700" font-family="monospace">1× XXH3-128 Blob PUT + Lease</text>

  <path d="M 885 562 L 885 484" stroke="#38bdf8" stroke-width="3.2" marker-end="url(#bpCyan)"/>
  <rect x="750" y="534" width="270" height="20" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="885" y="548" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="700" font-family="monospace">2.3–3.5s HEAD Relink + Lazy Range GET</text>

  <path d="M 1310 320 L 1310 562" stroke="#fbbf24" stroke-width="2.8" marker-end="url(#bpAmber)"/>
  <rect x="1195" y="534" width="230" height="20" rx="4" fill="#451a03" stroke="#fbbf24" stroke-width="1"/>
  <text x="1310" y="548" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="700" font-family="monospace">Nightly clickhouse-backup PUT</text>

  <!-- LAYER 4 & LAYER 5: S3 BUCKETS -->
  <g transform="translate(26, 566)">
    <!-- Layer 4: Shared CAS Pool -->
    <rect x="0" y="0" width="1028" height="176" rx="12" fill="#042f2e" stroke="#34d399" stroke-width="2"/>
    <rect x="0" y="0" width="1028" height="28" rx="12" fill="#047857"/>
    <text x="16" y="19" fill="#ecfdf5" font-size="12.5" font-weight="800">LAYER 4 — 1.00× SHARED CONTENT-ADDRESSED S3 POOL (NEVER-VERSIONED BUCKET)</text>

    <rect x="18" y="42" width="350" height="118" rx="8" fill="#090d16" stroke="#34d399" stroke-width="1.3"/>
    <text x="30" y="64" fill="#6ee7b7" font-size="12" font-weight="800" font-family="monospace">cas/tiered/blobs/&lt;xxh3-128&gt;</text>
    <text x="30" y="84" fill="#cbd5e1" font-size="10.5">• Stored physically <tspan fill="#34d399" font-weight="700">1.00×</tspan> across all replicas</text>
    <text x="30" y="102" fill="#cbd5e1" font-size="10.5">• Peer TTL moves skip body upload via <tspan font-family="monospace">HEAD</tspan></text>
    <text x="30" y="120" fill="#cbd5e1" font-size="10.5">• Scale-out readers adopt via <tspan font-family="monospace">CA_RELINK_COOKIE</tspan></text>
    <text x="30" y="142" fill="#34d399" font-size="10.5" font-weight="700" font-family="monospace">33d @ 30 TB/d = $1,436/mo flat</text>

    <rect x="384" y="42" width="312" height="118" rx="8" fill="#090d16" stroke="#10b981" stroke-width="1.2"/>
    <text x="396" y="64" fill="#6ee7b7" font-size="12" font-weight="800" font-family="monospace">cas/tiered/cas/ + gc/</text>
    <text x="396" y="84" fill="#cbd5e1" font-size="10.5">• Part manifests &amp; ref logs in S3</text>
    <text x="396" y="102" fill="#cbd5e1" font-size="10.5">• Source-tuned: <tspan font-family="monospace">gc=300s · lease=60s/20s</tspan></text>
    <text x="396" y="120" fill="#cbd5e1" font-size="10.5">• Monitored via <tspan font-family="monospace">system.cas_mounts</tspan></text>
    <text x="396" y="142" fill="#fde68a" font-size="10" font-family="monospace">S3 Versioning NEVER enabled (no Code 48)</text>

    <rect x="712" y="42" width="298" height="118" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="724" y="64" fill="#7dd3fc" font-size="12" font-weight="800" font-family="monospace">cold_legacy Bridge</text>
    <text x="724" y="84" fill="#cbd5e1" font-size="10.5">• <tspan font-family="monospace">tiered_cas</tspan> keeps <tspan font-family="monospace">s3_cache</tspan> as Vol 3</text>
    <text x="724" y="102" fill="#cbd5e1" font-size="10.5">• Passes <tspan font-family="monospace">checkCompatibleWith</tspan> live</text>
    <text x="724" y="120" fill="#cbd5e1" font-size="10.5">• Zero-downtime toggle from Gen 2</text>
    <text x="724" y="142" fill="#38bdf8" font-size="10" font-family="monospace">7d AbortIncompleteMultipartUpload</text>

    <!-- Layer 5: Blast Radius Isolation -->
    <rect x="1048" y="0" width="460" height="176" rx="12" fill="#23121b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="1048" y="0" width="460" height="28" rx="12" fill="#92400e"/>
    <text x="1064" y="19" fill="#fef3c7" font-size="12.5" font-weight="800">LAYER 5 — BLAST-RADIUS ISOLATION (VERSIONED DR)</text>

    <rect x="1066" y="42" width="424" height="118" rx="8" fill="#090d16" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="1078" y="64" fill="#fde68a" font-size="12" font-weight="800" font-family="monospace">s3://&lt;cluster&gt;-clickhouse-backups</text>
    <text x="1078" y="85" fill="#cbd5e1" font-size="10.5">• Separate AWS S3 bucket with Versioning &amp; least-privilege IAM</text>
    <text x="1078" y="104" fill="#cbd5e1" font-size="10.5">• Completely independent of the shared unversioned CAS blob pool</text>
    <text x="1078" y="123" fill="#cbd5e1" font-size="10.5">• Protects against CAS GC bugs, operator mistakes, or format upgrades</text>
    <text x="1078" y="143" fill="#34d399" font-size="10.5" font-weight="700" font-family="monospace">Tested full-cluster restore in ~15–20 minutes</text>
  </g>

  <!-- Footer summary -->
  <rect x="26" y="758" width="1508" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="780" y="785" text-anchor="middle" fill="#cbd5e1" font-size="12">
    <tspan fill="#34d399" font-weight="700">Gen 2 → Gen 3 is one Terraform boolean:</tspan> launch on GA Upstream 26.8 LTS when small; flip <tspan font-family="monospace" fill="#6ee7b7">cas_config.enabled = true</tspan> when replica count × retention justifies shared S3.
  </text>
</svg>
