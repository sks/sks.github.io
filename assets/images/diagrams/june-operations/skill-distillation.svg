<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Post-session skill distillation decisions</title>
<desc id="desc">A completed task is reviewed against similar skills; the novelty decision skips routine repetition, updates an existing procedure for a new edge case, or writes a new file for a distinct successful approach.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Distill only after the user-facing task</text><rect x="40" y="100" width="260" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="170.0" y="154.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Completed task</text><text x="170.0" y="184.0" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f6ff">Review what worked</text><rect x="350" y="100" width="260" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="480.0" y="154.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Find similar skills</text><text x="480.0" y="184.0" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f6ff">Check evidence + scope</text><rect x="660" y="100" width="260" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="790.0" y="154.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Novelty decision</text><text x="790.0" y="184.0" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f6ff">Draft in one model pass</text><path d="M 300 163 H 342" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 610 163 H 652" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 790 226 V 268" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170 268 H 790" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170 268 V 292" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 480 268 V 292" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 790 268 V 292" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="292" width="260" height="91" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="170.0" y="328.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Skip</text><text x="170.0" y="358.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Routine repetition</text><rect x="350" y="292" width="260" height="91" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="480.0" y="328.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Update</text><text x="480.0" y="358.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">New edge case in skill</text><rect x="660" y="292" width="260" height="91" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="790.0" y="328.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">New file</text><text x="790.0" y="358.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Distinct successful approach</text><text x="480" y="419" text-anchor="middle" font-size="17" font-weight="400" fill="#d3e3f4">Files are reviewable; the semantic index only helps retrieve them.</text></g>
</svg>
