<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Agent defense in depth from request to review</title>
<desc id="desc">A request check precedes policy at every tool route, followed by allow, human approval or hard denial, then tool execution. A claim review compares the answer to the trace, while an audit record supports later reconstruction rather than prevention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Separate controls address separate agent risks</text><rect x="22" y="116" width="208" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="126.0" y="170.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Request check</text><text x="126.0" y="200.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Screen user intent</text><rect x="258" y="116" width="208" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="362.0" y="155.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Tool boundary</text><text x="362.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">All execution routes</text><text x="362.0" y="215.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">+ least privilege</text><rect x="494" y="116" width="208" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="598.0" y="155.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Decision gate</text><text x="598.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Allow, approve,</text><text x="598.0" y="215.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">or hard deny</text><rect x="730" y="116" width="208" height="126" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="834.0" y="155.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Tool execution</text><text x="834.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Actual result</text><text x="834.0" y="215.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">and trace</text><path d="M 230 179 H 250" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 466 179 H 486" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 702 179 H 722" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 834 242 V 277" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 609 277 H 834" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 609 277 V 297" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 834 277 V 297" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="495" y="301" width="228" height="90" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="609.0" y="337.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Claim review</text><text x="609.0" y="367.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Compare response to trace</text><rect x="737" y="301" width="192" height="90" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="833.0" y="337.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Audit record</text><text x="833.0" y="367.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Reconstruct later</text><text x="30" y="423" text-anchor="start" font-size="17" font-weight="400" fill="#d3e3f4">Audit supports investigation; it does not block unsafe execution.</text></g>
</svg>
