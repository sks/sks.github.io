<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Agent telemetry has traces, metrics and audit records</title>
<desc id="desc">A session produces traces for timed model, tool and delegation spans, bounded metrics for trends and alerting, and audit records of calls and governance decisions for later reconstruction. Buffered traces can be incomplete.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Three complementary views of an agent session</text><rect x="345" y="83" width="270" height="87" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="480.0" y="117.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Agent session</text><text x="480.0" y="147.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Model, tools, delegation</text><path d="M 480 170 V 207" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 160 207 H 800" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 160 207 V 239" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 480 207 V 239" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 800 207 V 239" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="239" width="260" height="139" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="160.0" y="284.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Traces</text><text x="160.0" y="314.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Span sequence + cost</text><text x="160.0" y="344.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Debug one session</text><rect x="350" y="239" width="260" height="139" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="480.0" y="284.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Metrics</text><text x="480.0" y="314.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Bounded labels</text><text x="480.0" y="344.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Alert on trends</text><rect x="670" y="239" width="260" height="139" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="800.0" y="284.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Audit</text><text x="800.0" y="314.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Tools + decisions</text><text x="800.0" y="344.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Reconstruct later</text><text x="480" y="416" text-anchor="middle" font-size="17" font-weight="400" fill="#d3e3f4">Buffered trace export may have gaps; none of these alone proves usefulness.</text></g>
</svg>
