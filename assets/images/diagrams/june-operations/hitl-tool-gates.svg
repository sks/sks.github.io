<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Three outcomes at the human-in-the-loop tool gate</title>
<desc id="desc">Every proposed tool call, including delegated calls, passes governance: auto-approval for suitable read-only or internal operations, a pending human decision with expiry for consequential calls, or a hard deny regardless of approval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Gate each tool invocation, not command substrings</text><rect x="28" y="162" width="214" height="105" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="135.0" y="205.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Proposed tool call</text><text x="135.0" y="235.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Parent or delegated</text><rect x="300" y="162" width="220" height="105" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="410.0" y="205.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Governance</text><text x="410.0" y="235.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Same tool boundary</text><path d="M 242 214 H 291" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 520 214 H 560" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 112 V 350" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 112 H 606" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 560 231 H 606" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 560 350 H 606" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="615" y="67" width="314" height="90" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="772.0" y="103.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Auto-approve</text><text x="772.0" y="133.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Read-only / internal; check scope</text><rect x="615" y="186" width="314" height="90" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="772.0" y="222.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Approval pending</text><text x="772.0" y="252.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Approve / reject / expire</text><rect x="615" y="305" width="314" height="90" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="772.0" y="341.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Hard deny</text><text x="772.0" y="371.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Blocked even with human approval</text><text x="30" y="408" text-anchor="start" font-size="17" font-weight="400" fill="#d3e3f4">Pending requests have an expiry; dependent work waits for a decision.</text></g>
</svg>
