<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Terraform configuration review and invocation boundary</title>
<desc id="desc">Agent configuration and policy are declared in Git, previewed by CI with Terraform plan, reviewed and applied. A running durable task keeps its starting configuration; a next invocation uses the applied configuration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Review changes before they affect a new agent task</text><rect x="28" y="112" width="196" height="111" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="126.0" y="158.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Git pull request</text><text x="126.0" y="188.5" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Declare config + policy</text><rect x="264" y="112" width="196" height="111" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="362.0" y="158.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">CI: plan</text><text x="362.0" y="188.5" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Preview resource diff</text><rect x="500" y="112" width="196" height="111" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="598.0" y="158.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Review + merge</text><text x="598.0" y="188.5" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Inspect tool / policy changes</text><rect x="736" y="112" width="196" height="111" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="834.0" y="158.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Apply</text><text x="834.0" y="188.5" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Update platform config</text><path d="M 224 167 H 254" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 460 167 H 490" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 696 167 H 726" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 834 223 V 290" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="34" y="303" width="394" height="92" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="231.0" y="340.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Running task</text><text x="231.0" y="370.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Keeps config it started with</text><rect x="544" y="303" width="382" height="92" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="735.0" y="340.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Next invocation</text><text x="735.0" y="370.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Uses applied config</text><text x="480" y="429" text-anchor="middle" font-size="17" font-weight="400" fill="#d3e3f4">Plans help reveal drift and diffs; secrets and provider behavior still need care.</text></g>
</svg>
