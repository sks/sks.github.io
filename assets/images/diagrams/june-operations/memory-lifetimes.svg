<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Four Pensieve memory lifetimes</title>
<desc id="desc">A task feeds working memory that ends with the task, episodes ranked and validated on recall, cross-session notes updated or deleted, and skills changed or deprecated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Pensieve gives different information different lifetimes</text><rect x="370" y="78" width="220" height="54" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="480.0" y="111.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Agent task</text><path d="M 480 132 V 156" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 132 156 H 828" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 132 156 V 184" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 364 156 V 184" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 596 156 V 184" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 828 156 V 184" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="184" width="216" height="158" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="132.0" y="239.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Working</text><text x="132.0" y="269.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Task state</text><text x="132.0" y="299.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Ends with task</text><rect x="256" y="184" width="216" height="158" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="364.0" y="239.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Episodes</text><text x="364.0" y="269.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Prior outcomes</text><text x="364.0" y="299.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Rank; validate success</text><rect x="488" y="184" width="216" height="158" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="596.0" y="239.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Notes</text><text x="596.0" y="269.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Cross-session facts</text><text x="596.0" y="299.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Update or delete</text><rect x="720" y="184" width="216" height="158" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="828.0" y="239.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Skills</text><text x="828.0" y="269.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Reusable procedures</text><text x="828.0" y="299.0" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Change or deprecate</text><text x="480" y="398" text-anchor="middle" font-size="17" font-weight="400" fill="#d3e3f4">Recall still needs relevance and freshness checks; storage is not proof.</text></g>
</svg>
