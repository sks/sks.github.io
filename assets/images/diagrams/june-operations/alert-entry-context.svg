<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Entry path and alert state change investigation context</title>
<desc id="desc">Three paths with the same alert wording: Slack supplies structured identity and thread history, a UI paste may omit metadata, and a later hourly run can see the same alert ID after FIRING changes to RESOLVED. Each assessment needs its own evidence and timestamp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Same alert wording can arrive with different evidence</text><rect x="28" y="86" width="272" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="164.0" y="119.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Slack thread</text><text x="164.0" y="149.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">UID, fingerprint, history</text><rect x="355" y="86" width="275" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="492.5" y="119.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Session context</text><text x="492.5" y="149.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Structured identity present</text><rect x="690" y="86" width="242" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="811.0" y="119.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Assessment</text><text x="811.0" y="149.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Check evidence</text><path d="M 300 128 H 346" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 630 128 H 681" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="208" width="272" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="164.0" y="241.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">UI paste</text><text x="164.0" y="271.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Title and description</text><rect x="355" y="208" width="275" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="492.5" y="241.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Session context</text><text x="492.5" y="271.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Metadata may be absent</text><rect x="690" y="208" width="242" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="811.0" y="241.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Assessment</text><text x="811.0" y="271.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Check evidence</text><path d="M 300 250 H 346" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 630 250 H 681" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="330" width="272" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="164.0" y="363.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Later hourly run</text><text x="164.0" y="393.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Same alert ID</text><rect x="355" y="330" width="275" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="492.5" y="363.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Current state</text><text x="492.5" y="393.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">FIRING → RESOLVED</text><rect x="690" y="330" width="242" height="84" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="811.0" y="363.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Assessment</text><text x="811.0" y="393.0" text-anchor="middle" font-size="16" font-weight="400" fill="#f1f6ff">Check time + state</text><path d="M 300 372 H 346" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 630 372 H 681" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
</svg>
