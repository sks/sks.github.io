<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Embedded agent runtime and Aiden platform responsibilities</title>
<desc id="desc">Inside the Aiden process the embedded runtime manages the agent loop, context and tool calls while the platform handles workflows, policy, tenant scope, budgets and audit. The platform uses durable workflow checkpoints to resume after worker crashes or approval waits.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddde6"/></marker></defs>
<rect width="960" height="450" fill="#0b1628"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="30" y="48" text-anchor="start" font-size="26" font-weight="700" fill="#f1f6ff">Runtime and platform: distinct responsibilities, one process</text><rect x="18" y="79" width="924" height="221" rx="18" fill="#111e32" stroke="#647f9c" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="108" text-anchor="middle" font-size="17" font-weight="400" fill="#d3e3f4">Aiden process (runtime imported as a library)</text><rect x="45" y="135" width="374" height="131" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="232.0" y="191.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Runtime</text><text x="232.0" y="221.5" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f6ff">Agent loop • context • tool calls</text><rect x="541" y="135" width="374" height="131" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="728.0" y="176.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Platform</text><text x="728.0" y="206.5" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f6ff">Workflows • policy • tenant scope</text><text x="728.0" y="236.5" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f6ff">Budgets + audit</text><path d="M 419 201 H 532" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="294" text-anchor="middle" font-size="16" font-weight="400" fill="#d3e3f4">Library call; no separate network service between these layers</text><path d="M 728 300 V 321" fill="none" stroke="#7ddde6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="208" y="326" width="544" height="87" rx="16" fill="#192a42" stroke="#6c9ab7" stroke-width="2"/><text x="480.0" y="360.5" text-anchor="middle" font-size="20" font-weight="700" fill="#a8ecfb">Durable workflow</text><text x="480.0" y="390.5" text-anchor="middle" font-size="17" font-weight="400" fill="#f1f6ff">Checkpoint + resume after crash or approval wait</text></g>
</svg>
