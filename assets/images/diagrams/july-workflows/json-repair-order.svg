<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Repair syntax before validating shape</title><desc id="description">Malformed tool arguments pass through early and handler repair, then schema validation and domain semantic checks; unsafe ambiguity is rejected.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Repair syntax before validating shape</text><rect x="30" y="124" width="150" height="87" rx="12" fill="#fff1e9" stroke="#a0522d" stroke-width="2" /><text x="105.0" y="161.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Model tool</text><text x="105.0" y="186.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">arguments</text><rect x="222" y="124" width="163" height="87" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="303.5" y="161.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Early / agent</text><text x="303.5" y="186.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">repair</text><rect x="427" y="124" width="174" height="87" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="514.0" y="161.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Tool handler</text><text x="514.0" y="186.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">repair</text><rect x="643" y="124" width="174" height="87" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="730.0" y="161.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Schema</text><text x="730.0" y="186.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">validation</text><rect x="643" y="302" width="174" height="87" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="730.0" y="339.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Domain shape</text><text x="730.0" y="364.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">and policy</text><rect x="427" y="302" width="174" height="87" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="514.0" y="339.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Tool executes</text><text x="514.0" y="364.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">or rejects</text><path d="M 180 168 L 222 168" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 385 168 L 427 168" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 601 168 L 643 168" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 730 211 L 730 302" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 643 345 L 601 345" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="30" y="302" width="350" height="87" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="205.0" y="339.28" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Streaming: finalize argument block</text><text x="205.0" y="363.28" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">then try repair before parse</text><path d="M 200 302 L 200 247 L 510 247 L 510 211" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><text x="30" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Generic syntax repair cannot fix meaning; ambiguous or unsafe args must fail.</text></svg>