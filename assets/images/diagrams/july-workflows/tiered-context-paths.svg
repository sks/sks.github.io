<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" role="img" aria-labelledby="title description"><title id="title">Four context tiers feed one bounded turn</title><desc id="description">Active task and policy pins, recent turns, rolling summaries, and selectively fetched archive flow into an LLM turn at different fidelities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="535" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Four context tiers feed one bounded turn</text><rect x="30" y="88" width="320" height="72" rx="12" fill="#e5f3e9" stroke="#245478" stroke-width="2" /><text x="190.0" y="117.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">1  Active task</text><text x="190.0" y="141.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">goal + policy pins</text><path d="M 350 124 L 540 124 L 540 276" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="30" y="182" width="320" height="72" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="190.0" y="211.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">2  Recent turns</text><text x="190.0" y="235.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">sliding verbatim window</text><path d="M 350 218 L 540 218 L 540 276" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="30" y="276" width="320" height="72" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="190.0" y="305.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">3  Rolling summaries</text><text x="190.0" y="329.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">observations + digests</text><path d="M 350 312 L 540 312 L 540 276" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="30" y="370" width="320" height="72" rx="12" fill="#f3f0fb" stroke="#245478" stroke-width="2" /><text x="190.0" y="399.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">4  Archive</text><text x="190.0" y="423.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">full traces; fetch on demand</text><path d="M 350 406 L 540 406 L 540 276" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="600" y="190" width="294" height="170" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="747.0" y="268.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#14283f" text-anchor="middle">LLM turn</text><text x="747.0" y="295.3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#14283f" text-anchor="middle">bounded working context</text><path d="M 540 276 L 600 276" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="379" y="115" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">pinned</text><text x="379" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">sliding</text><text x="379" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">compacted</text><text x="379" y="396" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">selective</text><text x="30" y="494" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Tool responses are shaped for the model; full evidence stays retrievable for people.</text></svg>