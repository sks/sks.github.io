<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img" aria-labelledby="title description"><title id="title">Narrative is not the execution contract</title><desc id="description">A wiki stays human-first; Git-reviewed markdown has structured comment metadata checked by CI, bound to skills and runtime evidence gates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="525" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Narrative is not the execution contract</text><rect x="33" y="105" width="235" height="112" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="150.5" y="154.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Wiki / docs</text><text x="150.5" y="178.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">training, why, escalation</text><rect x="341" y="82" width="256" height="88" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="469.0" y="119.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Git markdown</text><text x="469.0" y="144.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">human steps + metadata</text><rect x="663" y="82" width="263" height="88" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="794.5" y="119.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">CI lint + registry</text><text x="794.5" y="144.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">validate contract</text><rect x="341" y="254" width="256" height="92" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="469.0" y="293.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Alert + discovery</text><text x="469.0" y="318.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">live incident state</text><rect x="663" y="254" width="263" height="92" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="794.5" y="293.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Bound skills</text><text x="794.5" y="318.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">allowlisted tools</text><rect x="663" y="396" width="263" height="81" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="794.5" y="430.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Runtime evidence gate</text><text x="794.5" y="455.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">promote on receipts</text><path d="M 597 126 L 663 126" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 795 170 L 795 254" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 597 300 L 663 300" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 795 346 L 795 396" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="35" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Context may inform a person; it does not silently replace the bound revision.</text></svg>