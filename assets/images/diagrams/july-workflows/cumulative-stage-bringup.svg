<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" role="img" aria-labelledby="title description"><title id="title">Green one cumulative slice at a time</title><desc id="description">Test stage one, then stages one and two, then add cross-plane corroboration; repeated golden gates precede the full synthesis run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="535" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Green one cumulative slice at a time</text><rect x="32" y="103" width="250" height="104" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="157.0" y="148.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Level 1: when</text><text x="157.0" y="173.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">time window → gate</text><rect x="353" y="103" width="250" height="104" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="478.0" y="148.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Level 2: when + who</text><text x="478.0" y="173.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">identity → gate</text><rect x="674" y="103" width="254" height="104" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="801.0" y="148.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Level 3: add planes</text><text x="801.0" y="173.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">corroboration → gate</text><path d="M 282 155 L 353 155" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 603 155 L 674 155" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="92" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#206145">repeat passes</text><text x="415" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#206145">repeat passes</text><text x="733" y="251" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#206145">repeat passes</text><rect x="92" y="311" width="775" height="87" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="479.5" y="360.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#14283f" text-anchor="middle">Then run the whole board: integration + final evidence-backed answer</text><path d="M 801 207 L 801 286 L 480 286 L 480 311" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="31" y="460" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Score typed tool actions and results, not matching words in runbook instructions.</text></svg>