<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title description"><title id="title">Correlation is a completion requirement</title><desc id="description">An operator request becomes session metadata; two prior-history searches must be recorded before a verdict may be accepted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="520" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Correlation is a completion requirement</text><rect x="30" y="100" width="180" height="86" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="120.0" y="136.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Operator asks</text><text x="120.0" y="161.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">to correlate</text><rect x="260" y="100" width="190" height="86" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="355.0" y="136.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Classify goal</text><text x="355.0" y="161.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">and stamp run</text><rect x="505" y="88" width="195" height="65" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="602.5" y="114.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Prior incidents</text><text x="602.5" y="139.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">by alert identity</text><rect x="505" y="197" width="195" height="65" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="602.5" y="223.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Prior sessions</text><text x="602.5" y="248.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">by alert identity</text><rect x="752" y="135" width="178" height="88" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="841.0" y="172.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Server-side gate</text><text x="841.0" y="197.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">checks both</text><rect x="752" y="314" width="178" height="78" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="841.0" y="346.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Accept verdict</text><text x="841.0" y="371.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">with search record</text><rect x="505" y="314" width="195" height="78" rx="12" fill="#fff1e9" stroke="#a0522d" stroke-width="2" /><text x="602.5" y="346.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Unavailable / failed</text><text x="602.5" y="371.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">record explicitly</text><path d="M 210 143 L 260 143" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 450 143 L 478 143 L 478 121 L 505 121" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 478 143 L 478 229 L 505 229" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 700 121 L 725 121 L 725 158 L 752 158" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 700 229 L 725 229 L 725 198 L 752 198" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 840 223 L 840 314" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 752 348 L 700 348" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" /><text x="30" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Gate checks that searches ran; it does not prove a prior incident is relevant.</text></svg>