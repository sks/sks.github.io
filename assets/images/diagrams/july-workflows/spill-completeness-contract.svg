<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title description"><title id="title">A preview is not a no-data result</title><desc id="description">Oversized query output leaves a preview and stored remainder; return_full, pages, or an aggregate over the spill determine completeness before a no-signal claim.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="530" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">A preview is not a no-data result</text><rect x="31" y="107" width="190" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="126.0" y="145.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Query result</text><text x="126.0" y="170.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">too large</text><rect x="263" y="77" width="197" height="80" rx="12" fill="#fff1e9" stroke="#a0522d" stroke-width="2" /><text x="361.5" y="110.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Preview</text><text x="361.5" y="135.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">not complete</text><rect x="263" y="209" width="197" height="80" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="361.5" y="242.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Stored remainder</text><text x="361.5" y="267.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">spill pointer</text><rect x="511" y="140" width="196" height="96" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="609.0" y="181.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">return_full / pages</text><text x="609.0" y="206.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">or spill aggregate</text><rect x="751" y="111" width="177" height="78" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="839.5" y="143.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">COMPLETE</text><text x="839.5" y="168.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">scope read</text><rect x="751" y="231" width="177" height="96" rx="12" fill="#fff1e9" stroke="#a0522d" stroke-width="2" /><text x="839.5" y="272.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">PARTIAL / FAILED</text><text x="839.5" y="297.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">pending or failed</text><path d="M 221 152 L 241 152 L 241 117 L 263 117" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 241 152 L 241 249 L 263 249" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 460 249 L 487 249 L 487 188 L 511 188" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 707 171 L 731 171 L 731 150 L 751 150" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 731 171 L 731 279 L 751 279" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="554" y="382" width="374" height="72" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="741.0" y="411.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Only COMPLETE can support</text><text x="741.0" y="435.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">“no signal in requested scope”</text><path d="M 928 150 L 946 150 L 946 419 L 928 419" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="30" y="486" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">PARTIAL with a spill pointer is more honest than claiming absence.</text></svg>