<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title description"><title id="title">Cloud permissions start with source call sites</title><desc id="description">CCE statically parses SDK calls, applies custom lenses before built-in cloud mapping, emits candidate operations, and supports reviewer and CI diff checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="520" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Cloud permissions start with source call sites</text><rect x="30" y="123" width="174" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="117.0" y="161.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Source tree</text><text x="117.0" y="186.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">SDK call sites</text><rect x="246" y="123" width="180" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="336.0" y="161.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Tree-sitter</text><text x="336.0" y="186.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">static parse</text><rect x="469" y="83" width="205" height="76" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="571.5" y="114.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Custom lens</text><text x="571.5" y="139.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">first match</text><rect x="469" y="209" width="205" height="76" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="571.5" y="240.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Built-in rules</text><text x="571.5" y="265.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">fill gaps</text><rect x="717" y="123" width="214" height="90" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="824.0" y="161.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Mapped tuples</text><text x="824.0" y="186.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">file / line / method</text><path d="M 204 168 L 246 168" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 426 168 L 448 168 L 448 121 L 469 121" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 448 168 L 448 247 L 469 247" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 674 121 L 695 121 L 695 155 L 717 155" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 674 247 L 695 247 L 695 182 L 717 182" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="130" y="335" width="284" height="88" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="272.0" y="372.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Compare with IAM</text><text x="272.0" y="397.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">human security review</text><rect x="545" y="335" width="284" height="88" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="687.0" y="372.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Diff reports in CI</text><text x="687.0" y="397.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">fail on new mapped calls</text><path d="M 785 213 L 785 308 L 272 308 L 272 335" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 785 308 L 687 308 L 687 335" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="30" y="478" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Candidate operations are not effective permissions or proof of runtime reachability.</text></svg>