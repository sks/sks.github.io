<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Where open-source framework changes end and product code begins</title>
  <desc id="desc">A framework provides reusable model and tool interfaces. A generic bug fix or interface change goes through a focused pull request upstream; private governance and tenant policy use those interfaces downstream. A temporary fork is a short-lived path until review and merge.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#29647a"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fffdf9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#192b3e">
    <text x="38" y="48" font-size="26" font-weight="700">What goes upstream, and what stays in the product?</text>
    <rect x="36" y="91" width="418" height="219" rx="16" fill="#e6f3f8" stroke="#29647a" stroke-width="2"/>
    <text x="58" y="131" font-size="21" font-weight="700">Open-source framework</text>
    <text x="58" y="166" font-size="18">Model and tool interfaces</text>
    <text x="58" y="194" font-size="18">Streaming, memory, cancellation</text>
    <rect x="58" y="220" width="373" height="66" rx="10" fill="#fffdf9" stroke="#29647a"/>
    <text x="77" y="248" font-size="17" font-weight="700">Upstream PR: reusable fix or hook</text>
    <text x="77" y="273" font-size="16">Reviewed by project maintainers</text>
    <rect x="506" y="91" width="418" height="219" rx="16" fill="#e7f3e7" stroke="#2e7553" stroke-width="2"/>
    <text x="528" y="131" font-size="21" font-weight="700">Private product</text>
    <text x="528" y="166" font-size="18">Tenant policy and governance</text>
    <text x="528" y="194" font-size="18">Customer-specific integrations</text>
    <rect x="528" y="220" width="373" height="66" rx="10" fill="#fffdf9" stroke="#2e7553"/>
    <text x="547" y="248" font-size="17" font-weight="700">Product implementation</text>
    <text x="547" y="273" font-size="16">Uses the public interfaces</text>
    <path d="M454 183 H494" stroke="#29647a" stroke-width="2.5" fill="none" marker-end="url(#tip)"/>
    <rect x="134" y="365" width="692" height="86" rx="14" fill="#fff1d4" stroke="#9b661c" stroke-width="2"/>
    <text x="155" y="397" font-size="19" font-weight="700">While the PR is pending: temporary fork</text>
    <text x="155" y="426" font-size="17">Carry the patch, then remove the fork when upstream accepts the change.</text>
    <path d="M246 310 V353" stroke="#9b661c" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#tip)"/>
    <path d="M715 354 V320" stroke="#9b661c" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#tip)"/>
    <text x="480" y="482" text-anchor="middle" font-size="16" fill="#40566a">Contribute the common interface; keep the customer-specific behavior in the product.</text>
  </g>
</svg>
