<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" role="img" aria-labelledby="title description"><title id="title">A diary proposes; humans decide</title><desc id="description">Audits, feedback and spend become a bounded digest, then a proposal queue; approval precedes typed draft materialization and normal review.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="555" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">A diary proposes; humans decide</text><rect x="27" y="111" width="169" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="111.5" y="149.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Runs, denials</text><text x="111.5" y="174.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">feedback, spend</text><rect x="233" y="111" width="170" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="318.0" y="149.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Summarizer</text><text x="318.0" y="174.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">bounded digest</text><rect x="442" y="111" width="170" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="527.0" y="149.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Evaluator</text><text x="527.0" y="174.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">proposals only</text><rect x="650" y="111" width="280" height="90" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="790.0" y="149.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Insight queue</text><text x="790.0" y="173.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">proposed / approved / dismissed</text><path d="M 196 156 L 233 156" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 403 156 L 442 156" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 612 156 L 650 156" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="650" y="290" width="280" height="81" rx="12" fill="#fff1e9" stroke="#a0522d" stroke-width="2" /><text x="790.0" y="324.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Human decision</text><text x="790.0" y="349.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">approve / dismiss</text><rect x="359" y="290" width="240" height="81" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="479.0" y="324.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Materializer</text><text x="479.0" y="349.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">typed draft only</text><rect x="27" y="290" width="278" height="81" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="166.0" y="324.28" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Git PR or reviewable diff</text><text x="166.0" y="348.28" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">normal change review</text><path d="M 790 201 L 790 290" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 650 331 L 599 331" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 359 331 L 305 331" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="228" y="476" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Later runs test whether an approved change actually helped.</text></svg>