<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description"><title id="title">Evidence and gate both reach presentation</title><desc id="description">The fixed DAG plans scope, gathers branch evidence, evaluates structural requirements, then presents using both the gate decision and gathered facts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Evidence and gate both reach presentation</text><rect x="30" y="106" width="174" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="117.0" y="144.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Plan / scope</text><text x="117.0" y="169.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">no RCA claim</text><rect x="251" y="106" width="207" height="90" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="354.5" y="144.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Gather evidence</text><text x="354.5" y="169.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">persist tokens</text><rect x="509" y="76" width="188" height="80" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="603.0" y="109.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Structural gate</text><text x="603.0" y="134.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">required keys / KPI</text><rect x="736" y="136" width="194" height="94" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="833.0" y="176.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Present RCA</text><text x="833.0" y="201.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#14283f" text-anchor="middle">human + appendix</text><path d="M 204 151 L 251 151" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 458 132 L 509 116" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 697 116 L 717 116 L 717 165 L 736 165" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 458 175 L 478 175 L 478 210 L 717 210 L 736 210" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><text x="510" y="241" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">facts, not only FINISH / GO_BACK</text><rect x="50" y="303" width="200" height="78" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="150.0" y="335.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Confirm symptom</text><text x="150.0" y="359.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">tool evidence</text><rect x="270" y="303" width="200" height="78" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="370.0" y="335.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Attribute impact</text><text x="370.0" y="359.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">tool evidence</text><rect x="490" y="303" width="200" height="78" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="590.0" y="335.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Dependency</text><text x="590.0" y="359.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">tool evidence</text><rect x="710" y="303" width="200" height="78" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="810.0" y="335.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#14283f" text-anchor="middle">Runtime</text><text x="810.0" y="359.78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#14283f" text-anchor="middle">tool evidence</text><path d="M 354 196 L 354 266 L 150 266 L 150 303" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><path d="M 354 266 L 370 266 L 370 303" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><path d="M 354 266 L 590 266 L 590 303" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><path d="M 354 266 L 810 266 L 810 303" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><text x="30" y="468" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#206145">Independent probes can run in parallel; later probes wait when they need discovered identities.</text></svg>