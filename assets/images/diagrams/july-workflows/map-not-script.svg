<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" role="img" aria-labelledby="title description"><title id="title">Linear script versus investigation map</title><desc id="description">A script runs fixed steps; the proposed map starts from topology, branches on probe results, reconciles planes, and stores reviewable verdict memory.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245478" /></marker></defs><rect x="0" y="0" width="960" height="565" fill="#ffffff" /><text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#14283f">Linear script versus investigation map</text><text x="115" y="86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#14283f">SCRIPT: fixed steps</text><text x="580" y="86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#14283f">MAP: environment + evidence</text><rect x="36" y="108" width="315" height="67" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="193.5" y="147.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Query metric A</text><rect x="36" y="213" width="315" height="67" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="193.5" y="252.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Check logs</text><rect x="36" y="318" width="315" height="67" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="193.5" y="357.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Write RCA</text><path d="M 193 175 L 193 213" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 193 280 L 193 318" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="445" y="108" width="450" height="67" rx="12" fill="#f3f0fb" stroke="#63539a" stroke-width="2" /><text x="670.0" y="147.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Alert + discovered topology</text><rect x="445" y="213" width="205" height="67" rx="12" fill="#ecf5fa" stroke="#245478" stroke-width="2" /><text x="547.5" y="252.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Verify-first probe</text><rect x="690" y="213" width="205" height="67" rx="12" fill="#fff1e9" stroke="#a0522d" stroke-width="2" /><text x="792.5" y="252.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Widen / retry</text><rect x="445" y="345" width="450" height="68" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="670.0" y="385.12" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Structured evidence + cross-plane check</text><rect x="445" y="463" width="450" height="67" rx="12" fill="#e5f3e9" stroke="#206145" stroke-width="2" /><text x="670.0" y="502.62" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#14283f" text-anchor="middle">Verdict + operator-reviewed memory</text><path d="M 670 175 L 548 213" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 650 246 L 690 246" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 793 280 L 793 319 L 548 319 L 548 280" fill="none" stroke="#245478" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><path d="M 548 280 L 548 345" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M 670 413 L 670 463" fill="none" stroke="#245478" stroke-width="2.5" marker-end="url(#arrow)" /></svg>