<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Hypotheses must survive checks</title>
<desc id="diagram-desc">Frame identity and onset, run cheap falsifying probes, compare explanations, then distinguish untestable branches from ruled-out branches in the report.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#315779"/></marker></defs>
<rect width="960" height="450" fill="#ffffff"/>
<text x="40" y="49" font-size="27" font-weight="bold" fill="#13243a">Hypotheses must survive checks</text>
<text x="40" y="79" font-size="16" font-weight="normal" fill="#40576e">Investigation path</text>
<rect x="40" y="112" width="260" height="137" rx="14" fill="#f6f9fe" stroke="#38608c" stroke-width="2"/>
<text x="57" y="143" font-size="18" font-weight="bold" fill="#13243a">Frame the symptom</text>
<text x="57" y="176" font-size="16" font-weight="normal" fill="#13243a">Who, when, which</text>
<text x="57" y="200" font-size="16" font-weight="normal" fill="#13243a">measurement?</text>
<rect x="350" y="112" width="260" height="137" rx="14" fill="#f6f9fe" stroke="#38608c" stroke-width="2"/>
<text x="367" y="143" font-size="18" font-weight="bold" fill="#13243a">Falsify cheaply</text>
<text x="367" y="176" font-size="16" font-weight="normal" fill="#13243a">Probe candidate causes;</text>
<text x="367" y="200" font-size="16" font-weight="normal" fill="#13243a">check against onset</text>
<rect x="660" y="112" width="260" height="137" rx="14" fill="#f6f9fe" stroke="#38608c" stroke-width="2"/>
<text x="677" y="143" font-size="18" font-weight="bold" fill="#13243a">Compare branches</text>
<text x="677" y="176" font-size="16" font-weight="normal" fill="#13243a">Keep alternatives alive</text>
<text x="677" y="200" font-size="16" font-weight="normal" fill="#13243a">until tested</text>
<path d="M305 181 H338 M615 181 H648" stroke="#315779" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M480 253 V279 H247 V294" stroke="#315779" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M790 253 V279 H713 V294" stroke="#315779" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="305" width="414" height="112" rx="14" fill="#fff7ec" stroke="#8a550a" stroke-width="2"/>
<text x="57" y="336" font-size="18" font-weight="bold" fill="#13243a">No test available</text>
<text x="57" y="369" font-size="16" font-weight="normal" fill="#13243a">Untestable is not</text>
<text x="57" y="393" font-size="16" font-weight="normal" fill="#13243a">ruled out</text>
<rect x="506" y="305" width="414" height="112" rx="14" fill="#edf8f5" stroke="#17665b" stroke-width="2"/>
<text x="523" y="336" font-size="18" font-weight="bold" fill="#13243a">Grade the report</text>
<text x="523" y="369" font-size="16" font-weight="normal" fill="#13243a">Supported finding or unknown;</text>
<text x="523" y="393" font-size="16" font-weight="normal" fill="#13243a">name the next discriminating probe</text>
<path d="M461 362 H494" stroke="#315779" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>
