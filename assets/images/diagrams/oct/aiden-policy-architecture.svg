<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Aiden OPA policy architecture</title>
<desc id="desc">Control plane stores policies and attachments. Data plane builds a factsheet, evaluates OPA, then allows, denies, or pauses for HITL before the tool runs.</desc>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5L0 10Z" fill="#255d78"/>
  </marker>
</defs>
<rect width="960" height="560" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17283c">
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700">Aiden policy architecture</text>

  <rect x="40" y="60" width="880" height="130" rx="12" fill="#e8f0f8" stroke="#255d78" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-size="16" font-weight="700">Control plane (manage)</text>
  <rect x="70" y="108" width="200" height="58" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="170" y="135" text-anchor="middle" font-size="13" font-weight="700">Rego in git</text>
  <text x="170" y="154" text-anchor="middle" font-size="12">opa test</text>
  <path d="M270 137H310" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="310" y="108" width="200" height="58" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="410" y="135" text-anchor="middle" font-size="13" font-weight="700">sg_policy</text>
  <text x="410" y="154" text-anchor="middle" font-size="12">Terraform / API</text>
  <path d="M510 137H550" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="550" y="108" width="200" height="58" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="650" y="135" text-anchor="middle" font-size="13" font-weight="700">attachment</text>
  <text x="650" y="154" text-anchor="middle" font-size="12">agent_name + UUID</text>
  <path d="M750 137H790" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="790" y="108" width="100" height="58" rx="8" fill="#cfe8dc" stroke="#416657" stroke-width="1.5"/>
  <text x="840" y="143" text-anchor="middle" font-size="13" font-weight="700">store</text>

  <text x="480" y="220" text-anchor="middle" font-size="16" font-weight="700">Data plane (enforce per tool call)</text>

  <rect x="40" y="240" width="140" height="70" rx="8" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="110" y="272" text-anchor="middle" font-size="13" font-weight="700">LLM</text>
  <text x="110" y="292" text-anchor="middle" font-size="12">picks tool</text>
  <path d="M180 275H220" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="240" width="160" height="70" rx="8" fill="#e8f0f8" stroke="#255d78" stroke-width="1.5"/>
  <text x="300" y="272" text-anchor="middle" font-size="13" font-weight="700">Runtime PEP</text>
  <text x="300" y="292" text-anchor="middle" font-size="12">build factsheet</text>
  <path d="M380 275H420" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="420" y="240" width="160" height="70" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="2"/>
  <text x="500" y="272" text-anchor="middle" font-size="13" font-weight="700">OPA PDP</text>
  <text x="500" y="292" text-anchor="middle" font-size="12">eval Rego</text>
  <path d="M580 275H620" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="230" width="110" height="40" rx="6" fill="#cfe8dc" stroke="#416657" stroke-width="1.5"/>
  <text x="675" y="255" text-anchor="middle" font-size="13" font-weight="700">allow</text>
  <path d="M730 250H770" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="770" y="230" width="150" height="40" rx="6" fill="#e8f0f8" stroke="#255d78" stroke-width="1.5"/>
  <text x="845" y="255" text-anchor="middle" font-size="13" font-weight="700">run tool</text>

  <rect x="620" y="280" width="110" height="40" rx="6" fill="#f5d4d4" stroke="#8a3a3a" stroke-width="1.5"/>
  <text x="675" y="305" text-anchor="middle" font-size="13" font-weight="700">deny</text>

  <rect x="620" y="330" width="110" height="40" rx="6" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="675" y="355" text-anchor="middle" font-size="13" font-weight="700">ask</text>
  <path d="M675 370V400" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="560" y="405" width="230" height="50" rx="8" fill="#fff8ee" stroke="#80602f" stroke-width="1.5"/>
  <text x="675" y="435" text-anchor="middle" font-size="13" font-weight="700">HITL approve / reject</text>

  <rect x="40" y="480" width="880" height="55" rx="8" fill="#fff8ee" stroke="#80602f" stroke-width="1.5"/>
  <text x="480" y="505" text-anchor="middle" font-size="13">PDP = policy decision (OPA). PEP = enforce before side effects. Attachments select which Rego runs for which agent.</text>
  <text x="480" y="524" text-anchor="middle" font-size="13">Sandbox layers (OpenShell-style) sit under this; they do not replace tool-call authorization.</text>
</g>
</svg>
