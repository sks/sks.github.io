<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">E2E learning loop blind spots</title>
<desc id="desc">Eight common bookkeeping failures that leave a supervised learning loop open even when jobs look green.</desc>
<rect width="960" height="560" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17283c" text-anchor="middle">
  <text x="480" y="40" font-size="24" font-weight="700">Green jobs can still leave the loop open</text>

  <rect x="36" y="70" width="214" height="104" rx="10" fill="#f7e5e8" stroke="#6d5060" stroke-width="1.5"/>
  <text x="143" y="110" font-size="15" font-weight="700">Cadence mismatch</text>
  <text x="143" y="136" font-size="13">feature scan is not</text>
  <text x="143" y="156" font-size="13">an anomaly sweep</text>

  <rect x="268" y="70" width="214" height="104" rx="10" fill="#f7e5e8" stroke="#6d5060" stroke-width="1.5"/>
  <text x="375" y="110" font-size="15" font-weight="700">Top-N false absence</text>
  <text x="375" y="136" font-size="13">unread pages are not</text>
  <text x="375" y="156" font-size="13">proof nothing failed</text>

  <rect x="500" y="70" width="214" height="104" rx="10" fill="#f7e5e8" stroke="#6d5060" stroke-width="1.5"/>
  <text x="607" y="110" font-size="15" font-weight="700">Skip as success</text>
  <text x="607" y="136" font-size="13">green job with a</text>
  <text x="607" y="156" font-size="13">skipped suite</text>

  <rect x="732" y="70" width="192" height="104" rx="10" fill="#f7e5e8" stroke="#6d5060" stroke-width="1.5"/>
  <text x="828" y="110" font-size="15" font-weight="700">Fixture vs product</text>
  <text x="828" y="136" font-size="13">missing creds</text>
  <text x="828" y="156" font-size="13">labeled as a bug</text>

  <rect x="36" y="198" width="214" height="104" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="143" y="238" font-size="15" font-weight="700">Merge is not deploy</text>
  <text x="143" y="264" font-size="13">SHA on main is</text>
  <text x="143" y="284" font-size="13">not live yet</text>

  <rect x="268" y="198" width="214" height="104" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="375" y="238" font-size="15" font-weight="700">Lost proposals</text>
  <text x="375" y="264" font-size="13">plans never built</text>
  <text x="375" y="284" font-size="13">or cleaned up unread</text>

  <rect x="500" y="198" width="214" height="104" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="607" y="238" font-size="15" font-weight="700">Queue starvation</text>
  <text x="607" y="264" font-size="13">non-FIFO cancel</text>
  <text x="607" y="284" font-size="13">misses windows</text>

  <rect x="732" y="198" width="192" height="104" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="828" y="238" font-size="15" font-weight="700">No re-verify</text>
  <text x="828" y="264" font-size="13">merged without a</text>
  <text x="828" y="284" font-size="13">post-deploy run</text>

  <rect x="100" y="338" width="760" height="112" rx="12" fill="#eef4fb" stroke="#456077" stroke-width="2"/>
  <text x="480" y="380" font-size="18" font-weight="700">Operator fix</text>
  <text x="480" y="410" font-size="14">Record windows and limits. Inspect scenario counts. Require disposition,</text>
  <text x="480" y="432" font-size="14">exact-revision deploy, and a linked verification run before closing.</text>

  <text x="480" y="512" font-size="16" fill="#344960">Most open loops are bookkeeping failures, not model failures</text>
</g>
</svg>
