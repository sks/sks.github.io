<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">When an E2E finding is closed</title>
  <desc id="desc">Evidence planes feed a finding record. Closure needs disposition, runnable asserts, real checks, deploy when needed, and post-change verification.</desc>
  <rect width="960" height="580" fill="#fffdf8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17283c" text-anchor="middle">
    <text x="480" y="42" font-size="26" font-weight="700">A PR URL is not a closed finding</text>

    <rect x="24" y="72" width="120" height="60" rx="10" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
    <text x="84" y="108" font-size="15" font-weight="700">CI</text>
    <rect x="156" y="72" width="120" height="60" rx="10" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
    <text x="216" y="108" font-size="15" font-weight="700">Harness</text>
    <rect x="288" y="72" width="120" height="60" rx="10" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
    <text x="348" y="108" font-size="15" font-weight="700">Agent</text>
    <rect x="420" y="72" width="120" height="60" rx="10" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
    <text x="480" y="108" font-size="15" font-weight="700">Runner</text>
    <rect x="552" y="72" width="120" height="60" rx="10" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
    <text x="612" y="108" font-size="15" font-weight="700">Obs</text>
    <rect x="684" y="72" width="120" height="60" rx="10" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
    <text x="744" y="108" font-size="15" font-weight="700">PR</text>
    <rect x="816" y="72" width="120" height="60" rx="10" fill="#f7e5e8" stroke="#6d5060" stroke-width="1.5"/>
    <text x="876" y="108" font-size="15" font-weight="700">Human</text>

    <line x1="480" y1="140" x2="480" y2="168" stroke="#255d78" stroke-width="3"/>
    <polygon points="470,168 490,168 480,186" fill="#255d78"/>

    <rect x="140" y="194" width="680" height="78" rx="12" fill="#eef4fb" stroke="#456077" stroke-width="2"/>
    <text x="480" y="228" font-size="20" font-weight="700">Finding record</text>
    <text x="480" y="254" font-size="14">window / run / SHA / limits / unknowns / disposition</text>

    <line x1="480" y1="272" x2="480" y2="296" stroke="#255d78" stroke-width="3"/>
    <polygon points="470,296 490,296 480,314" fill="#255d78"/>

    <rect x="30" y="322" width="215" height="78" rx="10" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
    <text x="137" y="354" font-size="15" font-weight="700">1. Scope recorded</text>
    <text x="137" y="378" font-size="13">what was unread</text>

    <rect x="260" y="322" width="215" height="78" rx="10" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
    <text x="367" y="354" font-size="15" font-weight="700">2. Human decision</text>
    <text x="367" y="378" font-size="13">not just a draft URL</text>

    <rect x="490" y="322" width="215" height="78" rx="10" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
    <text x="597" y="354" font-size="15" font-weight="700">3. Runnable asserts</text>
    <text x="597" y="378" font-size="13">positive and negative</text>

    <rect x="720" y="322" width="210" height="78" rx="10" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
    <text x="825" y="354" font-size="15" font-weight="700">4. Checks executed</text>
    <text x="825" y="378" font-size="13">skip is not success</text>

    <rect x="140" y="430" width="300" height="78" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
    <text x="290" y="462" font-size="15" font-weight="700">5. Exact revision live</text>
    <text x="290" y="486" font-size="13">when product changed</text>

    <rect x="480" y="430" width="340" height="78" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
    <text x="650" y="462" font-size="15" font-weight="700">6 and 7. Re-assert and status</text>
    <text x="650" y="486" font-size="13">resolved / open / contradicted</text>

    <text x="480" y="550" font-size="16" fill="#344960">Track implemented gaps and verification latency, not PR count</text>
  </g>
</svg>
