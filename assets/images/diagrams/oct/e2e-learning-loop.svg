<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">Supervised E2E learning loop</title>
<desc id="desc">Product changes and scheduled tests feed coverage proposals. Observed failures feed fix proposals. Humans review, merge, deploy, and re-assert. Draft PRs alone do not close the loop.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5L0 10Z" fill="#255d78"/>
  </marker>
</defs>
<rect width="960" height="580" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17283c">
  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Automation proposes. Humans close the loop.</text>

  <rect x="36" y="72" width="210" height="78" rx="10" fill="#e3efff" stroke="#456077" stroke-width="2"/>
  <text x="141" y="104" text-anchor="middle" font-size="16" font-weight="700">Product changes</text>
  <text x="141" y="128" text-anchor="middle" font-size="14">commits and PRs</text>

  <path d="M246 111H274" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="282" y="72" width="210" height="78" rx="10" fill="#dff0e8" stroke="#416657" stroke-width="2"/>
  <text x="387" y="104" text-anchor="middle" font-size="16" font-weight="700">Scheduled E2E</text>
  <text x="387" y="128" text-anchor="middle" font-size="14">merge / nightly / weekly</text>

  <path d="M492 111H520" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="528" y="72" width="210" height="78" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="2"/>
  <text x="633" y="104" text-anchor="middle" font-size="16" font-weight="700">Runtime evidence</text>
  <text x="633" y="128" text-anchor="middle" font-size="14">CI / traces / logs</text>

  <path d="M738 111H766" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="774" y="72" width="150" height="78" rx="10" fill="#f7e5e8" stroke="#6d5060" stroke-width="2"/>
  <text x="849" y="104" text-anchor="middle" font-size="16" font-weight="700">Draft PRs</text>
  <text x="849" y="128" text-anchor="middle" font-size="14">coverage or fix</text>

  <path d="M849 150V178H480V196" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="170" y="204" width="620" height="88" rx="12" fill="#eef4fb" stroke="#456077" stroke-width="2"/>
  <text x="480" y="242" text-anchor="middle" font-size="20" font-weight="700">Human review, implement, merge</text>
  <text x="480" y="270" text-anchor="middle" font-size="15">Executable asserts and checks that actually run</text>

  <path d="M320 292V318" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M640 292V318" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="90" y="326" width="300" height="88" rx="10" fill="#dff0e8" stroke="#416657" stroke-width="2"/>
  <text x="240" y="362" text-anchor="middle" font-size="16" font-weight="700">Merged tests re-enter cadence</text>
  <text x="240" y="390" text-anchor="middle" font-size="14">next nightly proves execution</text>

  <rect x="570" y="326" width="300" height="88" rx="10" fill="#fff0d1" stroke="#80602f" stroke-width="2"/>
  <text x="720" y="362" text-anchor="middle" font-size="16" font-weight="700">Deploy exact revision</text>
  <text x="720" y="390" text-anchor="middle" font-size="14">then re-assert on that build</text>

  <path d="M240 414V448H720V428" fill="none" stroke="#255d78" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="480" y="472" text-anchor="middle" font-size="14" fill="#344960">dashed return: verified change feeds the next run</text>

  <text x="480" y="532" text-anchor="middle" font-size="16" fill="#344960">Open loop if draft-only, plan-only, skipped checks, or never deployed</text>
</g>
</svg>
