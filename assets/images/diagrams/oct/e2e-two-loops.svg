<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Two E2E feedback loops</title>
<desc id="desc">Loop A turns product changes into coverage. Loop B turns observed failures into fixes and regression asserts. Keep them separate until a human joins the work.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5L0 10Z" fill="#255d78"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17283c">
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700">Two inputs. One human gate.</text>

  <rect x="36" y="66" width="430" height="380" rx="14" fill="#eef8f3" stroke="#416657" stroke-width="2"/>
  <text x="251" y="100" text-anchor="middle" font-size="20" font-weight="700">Loop A: coverage</text>
  <text x="251" y="124" text-anchor="middle" font-size="14">product change to gap plan to asserts</text>

  <rect x="66" y="148" width="370" height="50" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="251" y="179" text-anchor="middle" font-size="15">1. Scan recent user-visible commits</text>
  <path d="M251 198V214" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="66" y="218" width="370" height="50" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="251" y="249" text-anchor="middle" font-size="15">2. Draft coverage plan or no-gap note</text>
  <path d="M251 268V284" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="66" y="288" width="370" height="50" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="251" y="319" text-anchor="middle" font-size="15">3. Human ships runnable +/- asserts</text>
  <path d="M251 338V354" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="66" y="358" width="370" height="58" rx="8" fill="#cfe8dc" stroke="#416657" stroke-width="1.5"/>
  <text x="251" y="393" text-anchor="middle" font-size="15" font-weight="700">4. Cadence run proves coverage</text>

  <rect x="494" y="66" width="430" height="380" rx="14" fill="#fff8ee" stroke="#80602f" stroke-width="2"/>
  <text x="709" y="100" text-anchor="middle" font-size="20" font-weight="700">Loop B: failure</text>
  <text x="709" y="124" text-anchor="middle" font-size="14">evidence to classify to fix to verify</text>

  <rect x="524" y="148" width="370" height="50" rx="8" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="709" y="179" text-anchor="middle" font-size="15">1. Inventory failures in a fixed window</text>
  <path d="M709 198V214" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="524" y="218" width="370" height="50" rx="8" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="709" y="249" text-anchor="middle" font-size="15">2. Correlate run, deploy, traces, logs</text>
  <path d="M709 268V284" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="524" y="288" width="370" height="50" rx="8" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="709" y="319" text-anchor="middle" font-size="15">3. Draft product or test fix (or none)</text>
  <path d="M709 338V354" fill="none" stroke="#255d78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="524" y="358" width="370" height="58" rx="8" fill="#f5e0b8" stroke="#80602f" stroke-width="1.5"/>
  <text x="709" y="393" text-anchor="middle" font-size="15" font-weight="700">4. Deploy exact SHA, then re-assert</text>

  <text x="480" y="492" text-anchor="middle" font-size="16" fill="#344960">Conflating the loops hides whether you missed a contract or a regression</text>
</g>
</svg>
