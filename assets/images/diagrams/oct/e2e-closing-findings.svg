<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">When an E2E finding is closed</title>
<desc id="desc">Evidence planes feed a finding record. Closure requires human disposition, runnable asserts, real execution, deploy when needed, and post-change verification.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0 0L10 5L0 10Z" fill="#255d78"/>
  </marker>
</defs>
<rect width="960" height="560" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17283c" text-anchor="middle">
  <text x="480" y="40" font-size="24" font-weight="700">A PR URL is not a closed finding</text>

  <rect x="28" y="68" width="118" height="58" rx="8" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
  <text x="87" y="103" font-size="14" font-weight="700">CI</text>
  <rect x="160" y="68" width="118" height="58" rx="8" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
  <text x="219" y="103" font-size="14" font-weight="700">Harness</text>
  <rect x="292" y="68" width="118" height="58" rx="8" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
  <text x="351" y="103" font-size="14" font-weight="700">Agent</text>
  <rect x="424" y="68" width="118" height="58" rx="8" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
  <text x="483" y="103" font-size="14" font-weight="700">Runner</text>
  <rect x="556" y="68" width="118" height="58" rx="8" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
  <text x="615" y="103" font-size="14" font-weight="700">Obs</text>
  <rect x="688" y="68" width="118" height="58" rx="8" fill="#e3efff" stroke="#456077" stroke-width="1.5"/>
  <text x="747" y="103" font-size="14" font-weight="700">PR</text>
  <rect x="820" y="68" width="112" height="58" rx="8" fill="#f7e5e8" stroke="#6d5060" stroke-width="1.5"/>
  <text x="876" y="103" font-size="14" font-weight="700">Human</text>

  <path d="M480 126V156" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="160" y="164" width="640" height="78" rx="10" fill="#eef4fb" stroke="#456077" stroke-width="2"/>
  <text x="480" y="196" font-size="18" font-weight="700">Finding record</text>
  <text x="480" y="222" font-size="14">window / run / SHA / limits / unknowns / disposition</text>

  <path d="M480 242V268" fill="none" stroke="#255d78" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="276" width="210" height="72" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="145" y="306" font-size="15" font-weight="700">1. Scope recorded</text>
  <text x="145" y="328" font-size="13">what was unread</text>

  <rect x="270" y="276" width="210" height="72" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="375" y="306" font-size="15" font-weight="700">2. Human decision</text>
  <text x="375" y="328" font-size="13">not just a draft URL</text>

  <rect x="500" y="276" width="210" height="72" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="605" y="306" font-size="15" font-weight="700">3. Runnable asserts</text>
  <text x="605" y="328" font-size="13">positive and negative</text>

  <rect x="730" y="276" width="190" height="72" rx="8" fill="#dff0e8" stroke="#416657" stroke-width="1.5"/>
  <text x="825" y="306" font-size="15" font-weight="700">4. Checks executed</text>
  <text x="825" y="328" font-size="13">skip is not success</text>

  <rect x="140" y="380" width="300" height="72" rx="8" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="290" y="410" font-size="15" font-weight="700">5. Exact revision live</text>
  <text x="290" y="432" font-size="13">when product changed</text>

  <rect x="480" y="380" width="340" height="72" rx="8" fill="#fff0d1" stroke="#80602f" stroke-width="1.5"/>
  <text x="650" y="410" font-size="15" font-weight="700">6-7. Re-assert and durable status</text>
  <text x="650" y="432" font-size="13">resolved / open / contradicted</text>

  <text x="480" y="510" font-size="16" fill="#344960">Track implemented gaps and verification latency, not PR count</text>
</g>
</svg>
