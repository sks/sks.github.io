<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">A handoff gate stops duplicate workers</title><desc id="desc">After a worker has returned successfully, the planner gate rejects another spawn ; no new worker. Count spawn attempts separately from actual workers and still use the external judge to verify task success.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">A handoff gate stops duplicate workers</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">A spawn request is not evidence that a new worker actually ran.</text>
<rect x="30" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Plan task</text><text x="48" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Coordinator delegates</text><text x="48" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">one bounded subtask</text><rect x="345" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Worker returns</text><text x="363" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Result carries findings</text><text x="363" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">back to coordinator</text><rect x="660" y="112" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Handoff gate</text><text x="678" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Record successful</text><text x="678" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">return for this step</text><rect x="660" y="290" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Duplicate request</text><text x="678" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Return stored result</text><text x="678" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">; no new worker</text><rect x="345" y="290" width="270" height="126" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Trace two counts</text><text x="363" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Spawn attempts ≠</text><text x="363" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">real worker runs</text><rect x="30" y="290" width="270" height="126" rx="14" fill="#fff1d9" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Judge outcome</text><text x="48" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Reduced overhead is</text><text x="48" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">not task completion</text><path d="M300 175 L342 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 175 L657 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 238 L795 287" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M657 353 L618 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M342 353 L303 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Gate coordination retries; verify the app state separately.</text>
</svg>
