<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Unattended eval: prove the work happened</title><desc id="desc">The harness denies clarifying questions that would stall unattended tests, requires domain tool calls for mutation tasks, and checks final simulated app state with an external judge rather than accepting worker prose.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Unattended eval: prove the work happened</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">Benchmark-only rules belong in harness configuration, not a runtime fork.</text>
<rect x="30" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Unattended task</text><text x="48" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">No human at keyboard</text><text x="48" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">to answer a question</text><rect x="345" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Harness policy</text><text x="363" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Deny clarify tool;</text><text x="363" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">require tool-calling step</text><rect x="660" y="112" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Worker execution</text><text x="678" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Count domain app calls</text><text x="678" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">for mutation tasks</text><rect x="660" y="290" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">State inspection</text><text x="678" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Save and evaluate</text><text x="678" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">the simulated apps</text><rect x="345" y="290" width="270" height="126" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Failure classification</text><text x="363" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Clarify stall, zero tool</text><text x="363" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">or judge failure</text><path d="M300 175 L342 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 175 L657 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 238 L795 287" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M657 353 L618 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">A read-only task needs a different receipt than a mutation task.</text>
</svg>
