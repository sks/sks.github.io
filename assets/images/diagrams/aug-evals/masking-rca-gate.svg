<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Masking saves context; evidence still decides</title><desc id="desc">After a durable note, the host may replace older large tool results with pointers. In the matched investigation ON saved cost, but collected less APM and full-series evidence than OFF and failed RCA parity; recoverability alone did not establish quality.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Masking saves context; evidence still decides</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">Only clear after offload; compare both arms against the same evidence checklist.</text>
<rect x="345" y="108" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="140" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Tool observations</text><text x="363" y="170" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Write durable findings</text><text x="363" y="194" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">before shrinking window</text><rect x="76" y="264" width="350" height="145" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="94" y="296" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Clearing OFF</text><text x="94" y="326" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Older results stay in</text><text x="94" y="350" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">active context</text><text x="94" y="374" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Probable upstream cause</text><rect x="534" y="264" width="350" height="145" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="552" y="296" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Clearing ON</text><text x="552" y="326" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Host masks old bodies</text><text x="552" y="350" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">with note pointers</text><text x="552" y="374" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Cause undetermined</text><path d="M415 234 L245 261" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 234 L715 261" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="430" font-size="16" font-weight="bold" fill="#17324d" text-anchor="middle">Both could read notes; ON still missed the RCA quality bar.</text>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Cost savings are secondary to equal evidence and recoverability.</text>
</svg>
