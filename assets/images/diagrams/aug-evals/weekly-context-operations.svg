<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Context engineering is four operations</title><desc id="desc">Write findings outside the window, select relevant context for a step, compress old context after preserving evidence, and isolate noisy work in a worker with a bounded handoff. Trace cost and tools, then grade the actual outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Context engineering is four operations</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">Manage what enters each model step; do not equate shorter prompts with better answers.</text>
<rect x="40" y="112" width="420" height="132" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="58" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Write</text><text x="58" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Save findings in durable notes</text><text x="58" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">outside active context</text><rect x="500" y="112" width="420" height="132" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="518" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Select</text><text x="518" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Retrieve only what this step</text><text x="518" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">needs from tools or memory</text><rect x="40" y="288" width="420" height="132" rx="14" fill="#fff1d9" stroke="#9db5cb" stroke-width="1.5"/><text x="58" y="320" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Compress</text><text x="58" y="350" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Trim older material after</text><text x="58" y="374" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">preserving recoverable evidence</text><rect x="500" y="288" width="420" height="132" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="518" y="320" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Isolate</text><text x="518" y="350" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Give noisy work a separate seat;</text><text x="518" y="374" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">return bounded findings</text>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Pair token traces with outcome and evidence-quality checks.</text>
</svg>
