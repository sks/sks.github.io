<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">AppWorld: agent calls tools, harness grades</title><desc id="desc">The eval harness initializes a task through the environment service, the agent calls domain tools via MCP to mutate simulated APIs, then the harness saves and evaluates state with the official judge. Check environment, APIs and MCP tool listing before a cohort.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">AppWorld: agent calls tools, harness grades</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">Keep task lifecycle endpoints outside the agent’s MCP tool set.</text>
<rect x="30" y="108" width="270" height="130" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="140" font-size="18" font-weight="bold" fill="#17324d">Eval harness</text><text x="48" y="170" font-size="16" font-weight="normal" fill="#17324d">Owns task lifecycle</text><text x="48" y="194" font-size="16" font-weight="normal" fill="#17324d">and judge calls</text>
<rect x="345" y="108" width="270" height="130" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="140" font-size="18" font-weight="bold" fill="#17324d">Environment :8000</text><text x="363" y="170" font-size="16" font-weight="normal" fill="#17324d">/initialize, /save,</text><text x="363" y="194" font-size="16" font-weight="normal" fill="#17324d">/evaluate</text>
<rect x="660" y="108" width="270" height="130" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="140" font-size="18" font-weight="bold" fill="#17324d">Official judge</text><text x="678" y="170" font-size="16" font-weight="normal" fill="#17324d">Checks saved app state,</text><text x="678" y="194" font-size="16" font-weight="normal" fill="#17324d">not agent prose</text>
<rect x="30" y="286" width="270" height="130" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="318" font-size="18" font-weight="bold" fill="#17324d">Agent runtime</text><text x="48" y="348" font-size="16" font-weight="normal" fill="#17324d">Does the task through</text><text x="48" y="372" font-size="16" font-weight="normal" fill="#17324d">domain tools only</text>
<rect x="345" y="286" width="270" height="130" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="318" font-size="18" font-weight="bold" fill="#17324d">MCP HTTP :10000</text><text x="363" y="348" font-size="16" font-weight="normal" fill="#17324d">Lists and calls app</text><text x="363" y="372" font-size="16" font-weight="normal" fill="#17324d">actions for agent</text>
<rect x="660" y="286" width="270" height="130" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="318" font-size="18" font-weight="bold" fill="#17324d">App APIs :9000</text><text x="678" y="348" font-size="16" font-weight="normal" fill="#17324d">Simulated Spotify,</text><text x="678" y="372" font-size="16" font-weight="normal" fill="#17324d">Venmo, phone, …</text>
<path d="M300 174 L342 174" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 174 L657 174" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M165 238 L165 283" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 351 L342 351" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 351 L657 351" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 283 L795 241" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Health gate: check :8000, :9000 and a nonempty MCP tool list.</text>
</svg>
