<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">One conversation, one debug bundle</title><desc id="desc">Search a conversation by initiator and channel, gather its multiple executions into one access-controlled redacted zip containing DAG, event replay, and judge report; grade recurring failure themes into product gates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">One conversation, one debug bundle</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">Follow the thread across runs instead of hunting exports one execution at a time.</text>
<rect x="30" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Find the thread</text><text x="48" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Initiator + Slack channel</text><text x="48" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">locate the conversation</text><rect x="345" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Gather all runs</text><text x="363" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Preserve run order and</text><text x="363" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">execution dependencies</text><rect x="660" y="112" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Export one zip</text><text x="678" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Access-controlled,</text><text x="678" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">appropriately redacted</text><rect x="660" y="290" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Inspect receipts</text><text x="678" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">DAG, full event replay,</text><text x="678" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">judge report together</text><rect x="345" y="290" width="270" height="126" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Grade a batch</text><text x="363" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Find duplicate digs,</text><text x="363" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">drift and empty claims</text><rect x="30" y="290" width="270" height="126" rx="14" fill="#fff1d9" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Ship gates</text><text x="48" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Reuse policy and</text><text x="48" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">user-goal checks</text><path d="M300 175 L342 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 175 L657 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 238 L795 287" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M657 353 L618 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M342 353 L303 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">A shortened preview is not the full tool result.</text>
</svg>
