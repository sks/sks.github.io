<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Verification is a system check, not prose</title><desc id="desc">An operator checklist defines required claims. Read-only checks query deployment, monitoring, and configuration systems and return timestamped evidence. Go evaluates freshness, errors and pass fields before the model may summarize the verdict.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Verification is a system check, not prose</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">A convincing agent summary cannot close an unverified remediation.</text>
<rect x="30" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Completion claim</text><text x="48" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">“Rollout is done” is</text><text x="48" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">a hypothesis to test</text><rect x="345" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Reviewable checklist</text><text x="363" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Map each claim to</text><text x="363" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">required observations</text><rect x="660" y="112" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Read-only checks</text><text x="678" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Query CD, metrics or</text><text x="678" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">configuration state</text><rect x="660" y="290" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Structured evidence</text><text x="678" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Keep time, artifact,</text><text x="678" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">result and errors</text><rect x="345" y="290" width="270" height="126" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Go decision gate</text><text x="363" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Reject stale, missing</text><text x="363" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">or failing evidence</text><rect x="30" y="290" width="270" height="126" rx="14" fill="#fff1d9" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Operator summary</text><text x="48" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Explain verdict after</text><text x="48" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">the gate decides</text><path d="M300 175 L342 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 175 L657 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 238 L795 287" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M657 353 L618 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M342 353 L303 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Request accepted ≠ rollout complete; unavailable checks ≠ success.</text>
</svg>
