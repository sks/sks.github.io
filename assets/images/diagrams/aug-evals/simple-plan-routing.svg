<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Route by task shape, then verify</title><desc id="desc">Shallow work with latency pressure can start in simple mode; collect-classify-mutate or focused work may justify a plan with workers. Both modes need external success and cost measurements rather than a universal winner claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Route by task shape, then verify</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">The three-task smoke cohort motivates a routing hypothesis, not a universal rule.</text>
<rect x="345" y="108" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="140" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Classify the errand</text><text x="363" y="170" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Shallow hop or</text><text x="363" y="194" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">multi-stage work?</text><rect x="76" y="264" width="350" height="145" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="94" y="296" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Simple loop</text><text x="94" y="326" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">One agent owns the</text><text x="94" y="350" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">tool sequence</text><text x="94" y="374" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Prefer speed and cost</text><rect x="534" y="264" width="350" height="145" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="552" y="296" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Plan + worker</text><text x="552" y="326" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Collect → classify →</text><text x="552" y="350" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">mutate or focused Q&amp;A</text><text x="552" y="374" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Pay for handoffs</text><path d="M415 234 L245 261" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 234 L715 261" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="430" font-size="16" font-weight="bold" fill="#17324d" text-anchor="middle">Check strict outcome, failure class, wall time and total prompt.</text>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Keep both modes while evidence for a routing policy is small.</text>
</svg>
