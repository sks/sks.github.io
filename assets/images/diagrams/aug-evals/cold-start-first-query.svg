<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Cold start: the work before the query</title><desc id="desc">An alert waits through repeated vault checks and unchanged MCP catalog indexing before the first useful Grafana query. Share readiness and skip unchanged writes, but invalidate on change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c83"/></marker></defs>
<rect width="960" height="500" fill="#f7fafc"/>
<rect x="0" y="0" width="960" height="8" fill="#087c83"/>
<text x="34" y="49" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Cold start: the work before the query</text><text x="34" y="78" font-size="16" font-weight="normal" fill="#40556c" text-anchor="start">Measure operator request to first useful tool call, not first chat reply.</text>
<rect x="30" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="48" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Alert arrives</text><text x="48" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Operator asks for</text><text x="48" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">an investigation</text><rect x="345" y="112" width="270" height="126" rx="14" fill="#e4f1fb" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Worker readiness</text><text x="363" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Share vault check</text><text x="363" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">within worker lifetime</text><rect x="660" y="112" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="144" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Catalog gate</text><text x="678" y="174" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">Hash tool list; skip</text><text x="678" y="198" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">unchanged index writes</text><rect x="660" y="290" width="270" height="126" rx="14" fill="#e2f5ed" stroke="#9db5cb" stroke-width="1.5"/><text x="678" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">First useful query</text><text x="678" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">PromQL reaches Grafana</text><text x="678" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">earlier, not faster</text><rect x="345" y="290" width="270" height="126" rx="14" fill="#efeafe" stroke="#9db5cb" stroke-width="1.5"/><text x="363" y="322" font-size="18" font-weight="bold" fill="#17324d" text-anchor="start">Gateway failure?</text><text x="363" y="352" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">One bounded retry on</text><text x="363" y="376" font-size="16" font-weight="normal" fill="#17324d" text-anchor="start">502/503, then report</text><path d="M300 175 L342 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 175 L657 175" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 238 L795 287" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/><path d="M657 353 L618 353" fill="none" stroke="#087c83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="442" width="900" height="39" rx="8" fill="#e7eff3"/><text x="48" y="468" font-size="16" font-weight="bold" fill="#17324d" text-anchor="start">Invalidate readiness when credentials or tool definitions change.</text>
</svg>
