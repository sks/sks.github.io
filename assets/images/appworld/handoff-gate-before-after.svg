<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Fairness and planner token ratio before and after handoff gate fix</title>
  <desc id="desc">Two-panel chart for plan_fit_5 cohort n=5. Left: fairness pairs OK rose from 2 to 5 of 5. Right: average planner-over-single token ratio fell from 1.34x to 0.86x.</desc>
  <defs>
    <style>
      .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .panel-title { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .axis { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .value { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .baseline { stroke: #9ca3af; stroke-width: 1; }
      .panel { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; rx: 8; }
    </style>
  </defs>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" class="title">Before vs after handoff gate (plan_fit_5, n=5)</text>
  <text x="360" y="52" text-anchor="middle" class="subtitle">AppWorld MCP eval &#183; plan_fit_5 cohort, n=5</text>

  <!-- Left panel: Fairness pairs OK (scale 0-5) -->
  <rect x="40" y="72" width="300" height="280" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="8"/>
  <text x="190" y="96" text-anchor="middle" class="panel-title">Fairness pairs OK</text>
  <text x="190" y="112" text-anchor="middle" class="axis">of 5 task pairs</text>
  <line x1="72" y1="300" x2="308" y2="300" class="baseline"/>
  <line x1="72" y1="252" x2="308" y2="252" class="grid"/>
  <line x1="72" y1="204" x2="308" y2="204" class="grid"/>
  <line x1="72" y1="156" x2="308" y2="156" class="grid"/>
  <line x1="72" y1="108" x2="308" y2="108" class="grid"/>
  <text x="64" y="304" text-anchor="end" class="axis">0</text>
  <text x="64" y="256" text-anchor="end" class="axis">1</text>
  <text x="64" y="208" text-anchor="end" class="axis">2</text>
  <text x="64" y="160" text-anchor="end" class="axis">3</text>
  <text x="64" y="112" text-anchor="end" class="axis">5</text>
  <!-- Pre: 2/5, Post: 5/5 (max 5, plot height 192) -->
  <rect x="120" y="223" width="52" height="77" fill="#2563eb" rx="3"/>
  <rect x="196" y="108" width="52" height="192" fill="#16a34a" rx="3"/>
  <text x="146" y="215" text-anchor="middle" class="value" fill="#2563eb">2</text>
  <text x="222" y="100" text-anchor="middle" class="value" fill="#16a34a">5</text>
  <text x="146" y="324" text-anchor="middle" class="label">Pre-gate</text>
  <text x="222" y="324" text-anchor="middle" class="label">Post-gate</text>

  <!-- Right panel: Token ratio (scale 0-1.5) -->
  <rect x="380" y="72" width="300" height="280" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="8"/>
  <text x="530" y="96" text-anchor="middle" class="panel-title">Avg token ratio</text>
  <text x="530" y="112" text-anchor="middle" class="axis">planner / single-agent</text>
  <line x1="412" y1="300" x2="648" y2="300" class="baseline"/>
  <line x1="412" y1="252" x2="648" y2="252" class="grid"/>
  <line x1="412" y1="204" x2="648" y2="204" class="grid"/>
  <line x1="412" y1="156" x2="648" y2="156" class="grid"/>
  <line x1="412" y1="108" x2="648" y2="108" class="grid"/>
  <text x="404" y="304" text-anchor="end" class="axis">0</text>
  <text x="404" y="256" text-anchor="end" class="axis">0.5</text>
  <text x="404" y="208" text-anchor="end" class="axis">1.0</text>
  <text x="404" y="160" text-anchor="end" class="axis">1.5</text>
  <!-- Pre: 1.34 = 171px, Post: 0.86 = 110px (scale 128px per 1.0) -->
  <rect x="460" y="129" width="52" height="171" fill="#dc2626" rx="3"/>
  <rect x="536" y="190" width="52" height="110" fill="#ea580c" rx="3"/>
  <text x="486" y="121" text-anchor="middle" class="value" fill="#dc2626">1.34&#215;</text>
  <text x="562" y="182" text-anchor="middle" class="value" fill="#ea580c">0.86&#215;</text>
  <text x="486" y="324" text-anchor="middle" class="label">Pre-gate</text>
  <text x="562" y="324" text-anchor="middle" class="label">Post-gate</text>

  <!-- Legend -->
  <rect x="140" y="368" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="158" y="378" class="legend">Pre-gate</text>
  <rect x="230" y="368" width="12" height="12" fill="#16a34a" rx="2"/>
  <text x="248" y="378" class="legend">Post-gate (fairness)</text>
  <rect x="400" y="368" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="418" y="378" class="legend">Pre-gate (ratio)</text>
  <rect x="530" y="368" width="12" height="12" fill="#ea580c" rx="2"/>
  <text x="548" y="378" class="legend">Post-gate (ratio)</text>
</svg>
