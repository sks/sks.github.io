<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Agent eval failure mode taxonomy on delegation-fit tasks</title>
  <desc id="desc">Decision tree style diagram classifying failure modes: budget before evaluate, PII placeholder poison, wrong API method 422, spawn infra unavailable, and prose PASS vs judge disagree. All paths end at judge pass 0.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
    <style>
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .node { font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .end { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #991b1b; }
    </style>
  </defs>
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="title">Failure modes when judge pass = 0 (plan_fit_5, n=5)</text>

  <!-- Start -->
  <rect x="300" y="48" width="120" height="36" fill="#e5e7eb" stroke="#6b7280" rx="18"/>
  <text x="360" y="70" text-anchor="middle" class="node">Agent run ends</text>

  <!-- Branches -->
  <line x1="280" y1="84" x2="120" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="84" x2="240" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="84" x2="360" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="84" x2="480" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="84" x2="600" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="48" y="120" width="144" height="52" fill="#dbeafe" stroke="#2563eb" rx="6"/>
  <text x="120" y="142" text-anchor="middle" class="node">Budget hit</text>
  <text x="120" y="158" text-anchor="middle" class="small">simple 4/5 &#183; plan 2/5</text>

  <rect x="208" y="120" width="144" height="52" fill="#ede9fe" stroke="#7c3aed" rx="6"/>
  <text x="280" y="142" text-anchor="middle" class="node">PII poison</text>
  <text x="280" y="158" text-anchor="middle" class="small">plan 2/5 only</text>

  <rect x="328" y="120" width="144" height="52" fill="#ffedd5" stroke="#ea580c" rx="6"/>
  <text x="400" y="142" text-anchor="middle" class="node">Wrong API 422</text>
  <text x="400" y="158" text-anchor="middle" class="small">both modes</text>

  <rect x="448" y="120" width="144" height="52" fill="#fee2e2" stroke="#dc2626" rx="6"/>
  <text x="520" y="142" text-anchor="middle" class="node">Spawn infra fail</text>
  <text x="520" y="158" text-anchor="middle" class="small">plan 3/5 unfair</text>

  <rect x="568" y="120" width="144" height="52" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="640" y="142" text-anchor="middle" class="node">Prose PASS</text>
  <text x="640" y="158" text-anchor="middle" class="small">judge disagrees</text>

  <!-- Converge -->
  <line x1="120" y1="172" x2="360" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="280" y1="172" x2="360" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="400" y1="172" x2="360" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="520" y1="172" x2="360" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="640" y1="172" x2="360" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="360" y2="240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="240" width="200" height="44" fill="#fecaca" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="360" y="260" text-anchor="middle" class="end">judge.success = false</text>
  <text x="360" y="276" text-anchor="middle" class="small">pass% may be 30-50% &#183; still a fail</text>

  <text x="360" y="308" text-anchor="middle" class="small">Classify failures before you compare planner vs single-agent.</text>
</svg>
