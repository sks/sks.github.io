<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Domain API calls per run before and after planner handoff fix</title>
  <desc id="desc">Grouped bar chart. Before fix: single-agent about 14 domain calls per run, planner path about 0. After fix on ten-task fair cohort: single-agent 13.8, planner 20.5. Judge pass remained 0 for both.</desc>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#111">Avg domain API calls per run (single-agent vs planner path)</text>
  <text x="320" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">Source: AppWorld MCP eval cohorts · judge pass = 0 both modes</text>
  <line x1="56" y1="280" x2="600" y2="280" stroke="#ccc" stroke-width="1"/>
  <text x="48" y="284" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#666">0</text>
  <text x="48" y="224" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#666">7</text>
  <text x="48" y="168" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#666">14</text>
  <text x="48" y="112" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#666">21</text>
  <text x="20" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333" transform="rotate(-90 20 196)">Calls per run</text>
  <!-- Before: smoke n=3 -->
  <rect x="120" y="120" width="48" height="160" fill="#2563eb"/>
  <rect x="176" y="280" width="48" height="0" fill="#dc2626"/>
  <text x="172" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#333">Before fix</text>
  <text x="144" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2563eb">14</text>
  <text x="200" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#dc2626">0</text>
  <!-- After: ten-mixed n=10 -->
  <rect x="360" y="123" width="48" height="157" fill="#2563eb"/>
  <rect x="416" y="86" width="48" height="194" fill="#dc2626"/>
  <text x="392" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#333">After fix (n=10)</text>
  <text x="384" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2563eb">13.8</text>
  <text x="440" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#dc2626">20.5</text>
  <rect x="200" y="318" width="14" height="14" fill="#2563eb"/>
  <text x="220" y="329" font-family="system-ui,sans-serif" font-size="11" fill="#333">Single-agent loop</text>
  <rect x="340" y="318" width="14" height="14" fill="#dc2626"/>
  <text x="360" y="329" font-family="system-ui,sans-serif" font-size="11" fill="#333">Planner + worker</text>
</svg>
