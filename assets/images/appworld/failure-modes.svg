<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Failure class counts on five delegation-fit AppWorld tasks</title>
  <desc id="desc">Grouped bar chart for plan-fit cohort n=5 per mode. Single-agent: 4 budget without evaluate, 1 true judge fail. Planner: 2 budget, 2 PII placeholder poison, 1 wrong API method 422, 2 spawn infra failures. Judge pass 0 for both.</desc>
  <defs>
    <style>
      .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .axis { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .label { font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .value { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .baseline { stroke: #9ca3af; stroke-width: 1; }
    </style>
  </defs>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" class="title">Failure classes (delegation-fit cohort)</text>
  <text x="360" y="52" text-anchor="middle" class="subtitle">n=5 per mode &#183; head-to-head ties 5/5 &#183; judge pass = 0</text>

  <!-- Y axis: 0-5, 40px per unit, baseline y=320 -->
  <line x1="72" y1="320" x2="680" y2="320" class="baseline"/>
  <line x1="72" y1="280" x2="680" y2="280" class="grid"/>
  <line x1="72" y1="240" x2="680" y2="240" class="grid"/>
  <line x1="72" y1="200" x2="680" y2="200" class="grid"/>
  <line x1="72" y1="160" x2="680" y2="160" class="grid"/>
  <line x1="72" y1="120" x2="680" y2="120" class="grid"/>
  <text x="64" y="324" text-anchor="end" class="axis">0</text>
  <text x="64" y="284" text-anchor="end" class="axis">1</text>
  <text x="64" y="244" text-anchor="end" class="axis">2</text>
  <text x="64" y="204" text-anchor="end" class="axis">3</text>
  <text x="64" y="164" text-anchor="end" class="axis">4</text>
  <text x="64" y="124" text-anchor="end" class="axis">5</text>
  <text x="24" y="220" text-anchor="middle" class="label" transform="rotate(-90 24 220)">Runs (of 5)</text>

  <!-- Helper: bar height = count * 40 -->
  <!-- Budget no eval: 4, 2 -->
  <rect x="100" y="160" width="32" height="160" fill="#2563eb" rx="2"/>
  <rect x="136" y="240" width="32" height="80" fill="#dc2626" rx="2"/>
  <text x="116" y="152" text-anchor="middle" class="value" fill="#2563eb">4</text>
  <text x="152" y="232" text-anchor="middle" class="value" fill="#dc2626">2</text>
  <text x="134" y="340" text-anchor="middle" class="label">Budget,</text>
  <text x="134" y="352" text-anchor="middle" class="label">no evaluate</text>

  <!-- Judge fail: 1, 0 -->
  <rect x="220" y="280" width="32" height="40" fill="#2563eb" rx="2"/>
  <rect x="256" y="318" width="32" height="2" fill="#dc2626" rx="1"/>
  <text x="236" y="272" text-anchor="middle" class="value" fill="#2563eb">1</text>
  <text x="272" y="308" text-anchor="middle" class="value" fill="#dc2626">0</text>
  <text x="254" y="340" text-anchor="middle" class="label">True judge</text>
  <text x="254" y="352" text-anchor="middle" class="label">fail</text>

  <!-- PII poison: 0, 2 -->
  <rect x="340" y="318" width="32" height="2" fill="#2563eb" rx="1"/>
  <rect x="376" y="240" width="32" height="80" fill="#7c3aed" rx="2"/>
  <text x="356" y="308" text-anchor="middle" class="value" fill="#2563eb">0</text>
  <text x="392" y="232" text-anchor="middle" class="value" fill="#7c3aed">2</text>
  <text x="374" y="340" text-anchor="middle" class="label">PII</text>
  <text x="374" y="352" text-anchor="middle" class="label">poison</text>

  <!-- Wrong method 422: 0, 1 -->
  <rect x="460" y="318" width="32" height="2" fill="#2563eb" rx="1"/>
  <rect x="496" y="280" width="32" height="40" fill="#ea580c" rx="2"/>
  <text x="476" y="308" text-anchor="middle" class="value" fill="#2563eb">0</text>
  <text x="512" y="272" text-anchor="middle" class="value" fill="#ea580c">1</text>
  <text x="494" y="340" text-anchor="middle" class="label">Wrong API</text>
  <text x="494" y="352" text-anchor="middle" class="label">method</text>

  <!-- Spawn infra: 0, 2 -->
  <rect x="580" y="318" width="32" height="2" fill="#2563eb" rx="1"/>
  <rect x="616" y="240" width="32" height="80" fill="#dc2626" rx="2"/>
  <text x="596" y="308" text-anchor="middle" class="value" fill="#2563eb">0</text>
  <text x="632" y="232" text-anchor="middle" class="value" fill="#dc2626">2</text>
  <text x="614" y="340" text-anchor="middle" class="label">Spawn</text>
  <text x="614" y="352" text-anchor="middle" class="label">infra fail</text>

  <!-- Legend -->
  <rect x="180" y="382" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="198" y="392" class="legend">Single-agent</text>
  <rect x="300" y="382" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="318" y="392" class="legend">Planner</text>
  <rect x="400" y="382" width="12" height="12" fill="#7c3aed" rx="2"/>
  <text x="418" y="392" class="legend">Planner (PII)</text>
  <rect x="530" y="382" width="12" height="12" fill="#ea580c" rx="2"/>
  <text x="548" y="392" class="legend">Planner (422)</text>
</svg>
