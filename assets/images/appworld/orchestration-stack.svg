<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Orchestration tax stack: coordination overhead on top of domain work</title>
  <desc id="desc">Stacked bar showing single-agent work is mostly domain API calls. Planner path adds spawn, repair, and gate retry layers. Fair cohort ratios: 1.64x tokens, 3.0x iterations, 1.49x domain calls.</desc>
  <defs>
    <style>
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="title">Where the orchestration tax shows up (fair cohort, n=10)</text>

  <!-- Single-agent stack -->
  <text x="180" y="58" text-anchor="middle" class="label">Single-agent</text>
  <rect x="100" y="200" width="160" height="80" fill="#2563eb" rx="4"/>
  <text x="180" y="245" text-anchor="middle" class="badge">Domain work</text>
  <text x="180" y="262" text-anchor="middle" class="small" fill="#ffffff">~14 iterations</text>
  <text x="180" y="292" text-anchor="middle" class="small">baseline = 1.0</text>

  <!-- Planner stack -->
  <text x="500" y="58" text-anchor="middle" class="label">Planner + worker</text>
  <rect x="420" y="220" width="160" height="60" fill="#2563eb" rx="0"/>
  <rect x="420" y="170" width="160" height="50" fill="#f97316" rx="0"/>
  <rect x="420" y="90" width="160" height="80" fill="#dc2626" rx="4"/>
  <text x="500" y="255" text-anchor="middle" class="badge">Domain work</text>
  <text x="500" y="198" text-anchor="middle" class="badge">Spawn + repair</text>
  <text x="500" y="132" text-anchor="middle" class="badge">Gate retries</text>
  <text x="500" y="292" text-anchor="middle" class="small">~3.0&#215; iterations &#183; ~1.6&#215; tokens</text>

  <!-- Ratio badges -->
  <rect x="580" y="100" width="56" height="24" fill="#dc2626" rx="12"/>
  <text x="608" y="116" text-anchor="middle" class="badge" font-size="10">3.0&#215;</text>
  <rect x="580" y="178" width="56" height="24" fill="#f97316" rx="12"/>
  <text x="608" y="194" text-anchor="middle" class="badge" font-size="10">~3 spawns</text>

  <!-- Legend -->
  <rect x="24" y="78" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="42" y="88" class="small">Domain API work (necessary)</text>
  <rect x="24" y="98" width="12" height="12" fill="#f97316" rx="2"/>
  <text x="42" y="108" class="small">Spawn / handoff repair</text>
  <rect x="24" y="118" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="42" y="128" class="small">Blocked retries (waste)</text>

  <text x="360" y="278" text-anchor="middle" class="small">Judge pass = 0 both modes &#183; tax did not buy success on this sample</text>
</svg>
