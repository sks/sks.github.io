<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Session trace</title>
  <desc id="desc">Trace tree with plan, gather, and present stages, tool latency, and token cost.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #0b1220; }
      .top { fill: #111827; }
      .panel { fill: #111827; stroke: #1f2937; }
      .row { fill: #0f172a; stroke: #1e293b; }
      .row-alt { fill: #0b1324; stroke: #1e293b; }
      .pill-trace { fill: #1e3a5f; stroke: #3b82f6; }
      .pill-gen { fill: #172554; stroke: #60a5fa; }
      .pill-tool { fill: #052e1c; stroke: #34d399; }
      .pill-span { fill: #083344; stroke: #22d3ee; }
      /* tool rows use .pill-tool */
      .h { font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #e5e7eb; }
      .m { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .t { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
      .c { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .ok { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #34d399; }
      .warn { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fbbf24; }
      .tree { stroke: #334155; stroke-width: 1.25; fill: none; }
    ]]></style>
  </defs>

