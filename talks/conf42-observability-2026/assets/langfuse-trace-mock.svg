<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized Langfuse-style session trace</title>
  <desc id="desc">Mock UI: plan, gather, present stages with per-tool cost and latency attribution.</desc>
  <defs>
    <style>
      .chrome { fill: #1e293b; }
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #e2e8f0; }
      .tree-line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .span-llm { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
      .span-tool { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; }
      .span-stage { fill: #ecfeff; stroke: #00add8; stroke-width: 1; }
      .label { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .meta { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .header { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .cost { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b45309; }
      .ok { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #15803d; }
      .warn { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b45309; }
    </style>
  </defs>
  <rect width="760" height="420" class="bg"/>
  <rect x="0" y="0" width="760" height="36" class="chrome"/>
  <text x="20" y="23" class="header">Langfuse-style trace · acme-demo (anonymized) · Go runtime</text>

  <rect x="24" y="52" width="712" height="348" class="panel" rx="6"/>
  <text x="40" y="76" class="meta">session: sess-demo-42 · workflow: sre-investigate · OTEL trace linked</text>

  <rect x="40" y="88" width="280" height="24" class="span-stage" rx="4"/>
  <text x="52" y="104" class="label">stage: plan</text>
  <text x="340" y="104" class="cost">$0.02 · 0.6k tok · 0.4s</text>

  <line x1="52" y1="112" x2="52" y2="128" class="tree-line"/>
  <line x1="52" y1="128" x2="68" y2="128" class="tree-line"/>
  <rect x="68" y="118" width="260" height="22" class="span-llm" rx="4"/>
  <text x="80" y="133" class="label">llm.generate (plan)</text>

  <rect x="40" y="150" width="280" height="24" class="span-stage" rx="4"/>
  <text x="52" y="166" class="label">stage: gather</text>
  <text x="340" y="166" class="cost">$0.14 · 3.1k tok</text>

  <line x1="52" y1="174" x2="52" y2="190" class="tree-line"/>
  <line x1="52" y1="190" x2="84" y2="190" class="tree-line"/>
  <rect x="84" y="180" width="260" height="22" class="span-tool" rx="4"/>
  <text x="96" y="195" class="label">tool.grafana_query_range</text>
  <text x="360" y="195" class="meta">820ms · $0.00</text>

  <line x1="52" y1="202" x2="52" y2="218" class="tree-line"/>
  <line x1="52" y1="218" x2="84" y2="218" class="tree-line"/>
  <rect x="84" y="208" width="260" height="22" class="span-tool" rx="4"/>
  <text x="96" y="223" class="label">tool.grafana_query_range</text>
  <text x="360" y="223" class="warn">790ms · repeat</text>

  <line x1="52" y1="230" x2="52" y2="246" class="tree-line"/>
  <line x1="52" y1="246" x2="68" y2="246" class="tree-line"/>
  <rect x="68" y="236" width="260" height="22" class="span-llm" rx="4"/>
  <text x="80" y="251" class="label">llm.generate (gather)</text>
  <text x="360" y="251" class="cost">1.8k tok</text>

  <rect x="40" y="270" width="280" height="24" class="span-stage" rx="4"/>
  <text x="52" y="286" class="label">stage: present</text>
  <text x="340" y="286" class="cost">$0.04 · 0.9k tok</text>

  <line x1="52" y1="294" x2="52" y2="310" class="tree-line"/>
  <line x1="52" y1="310" x2="68" y2="310" class="tree-line"/>
  <rect x="68" y="300" width="260" height="22" class="span-llm" rx="4"/>
  <text x="80" y="315" class="label">llm.generate (present)</text>
  <text x="360" y="315" class="ok">evidence: cited tools</text>

  <text x="40" y="350" class="meta">Tool attribution: which call · latency · tokens/$ · loop signal on repeat</text>
  <text x="40" y="370" class="meta">Session ~4.6k tok shown · CFP hook case was ~40k narrating a wrong answer</text>
  <text x="40" y="392" class="meta">Mock for slides — replace with live capture for recording (no live cloud required)</text>
</svg>
