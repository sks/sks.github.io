<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Dual-sink observability</title>
  <desc id="desc">Agent execution fans out to LLM traces, service metrics, and structured logs.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; }
      .card-hot { fill: #0e7490; stroke: #22d3ee; }
      .h { font: 600 14px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .m { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .l { font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#ah); }
    ]]></style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="340" class="bg" rx="8"/>
  <text x="400" y="36" text-anchor="middle" class="h">Runtime sinks</text>

  <rect x="270" y="60" width="260" height="88" class="card-hot" rx="8"/>
  <text x="400" y="96" text-anchor="middle" class="l">agent runtime</text>
  <text x="400" y="118" text-anchor="middle" class="m">plan | gather | present</text>

  <path d="M320 148 C 220 180, 180 190, 140 210" class="arrow"/>
  <path d="M400 148 L 400 210" class="arrow"/>
  <path d="M480 148 C 580 180, 620 190, 660 210" class="arrow"/>

  <rect x="40" y="220" width="200" height="90" class="card" rx="8"/>
  <text x="140" y="254" text-anchor="middle" class="l">LLM traces</text>
  <text x="140" y="276" text-anchor="middle" class="m">session | tools | cost</text>
  <text x="140" y="294" text-anchor="middle" class="m">Langfuse-style</text>

  <rect x="300" y="220" width="200" height="90" class="card" rx="8"/>
  <text x="400" y="254" text-anchor="middle" class="l">Service metrics</text>
  <text x="400" y="276" text-anchor="middle" class="m">tokens | latency | SLO</text>
  <text x="400" y="294" text-anchor="middle" class="m">Prometheus / Grafana</text>

  <rect x="560" y="220" width="200" height="90" class="card" rx="8"/>
  <text x="660" y="254" text-anchor="middle" class="l">Structured logs</text>
  <text x="660" y="276" text-anchor="middle" class="m">trace_id join</text>
  <text x="660" y="294" text-anchor="middle" class="m">OpenTelemetry</text>
</svg>
