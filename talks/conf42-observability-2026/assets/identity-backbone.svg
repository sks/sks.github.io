<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Identity backbone</title>
  <desc id="desc">Session, workflow, stage, and persona stamped on every span.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #334155; }
      .box-hot { fill: #083344; stroke: #22d3ee; }
      .h { font: 600 14px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .l { font: 600 12px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .m { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#ah); }
    ]]></style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="280" class="bg" rx="8"/>
  <text x="400" y="36" text-anchor="middle" class="h">Span identity</text>

  <rect x="40" y="70" width="150" height="70" class="box" rx="8"/>
  <text x="115" y="100" text-anchor="middle" class="l">session</text>
  <text x="115" y="120" text-anchor="middle" class="m">sess_8f2a91c</text>

  <path d="M190 105 H228" class="arrow"/>

  <rect x="230" y="70" width="150" height="70" class="box" rx="8"/>
  <text x="305" y="100" text-anchor="middle" class="l">workflow</text>
  <text x="305" y="120" text-anchor="middle" class="m">sre-investigate</text>

  <path d="M380 105 H418" class="arrow"/>

  <rect x="420" y="70" width="150" height="70" class="box-hot" rx="8"/>
  <text x="495" y="100" text-anchor="middle" class="l">stage</text>
  <text x="495" y="120" text-anchor="middle" class="m">gather</text>

  <path d="M570 105 H608" class="arrow"/>

  <rect x="610" y="70" width="150" height="70" class="box" rx="8"/>
  <text x="685" y="100" text-anchor="middle" class="l">persona</text>
  <text x="685" y="120" text-anchor="middle" class="m">observer-sre</text>

  <rect x="140" y="180" width="520" height="64" class="box" rx="8"/>
  <text x="400" y="208" text-anchor="middle" class="l">Inherited by every child span</text>
  <text x="400" y="228" text-anchor="middle" class="m">filter: stage=present AND persona=observer-sre</text>
</svg>
