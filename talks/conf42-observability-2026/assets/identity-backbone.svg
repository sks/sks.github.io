<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
  <title id="title">Semantic identity backbone for agent telemetry</title>
  <desc id="desc">Session flows to workflow, stage, and persona for scoreable agent traces.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .box-hot { fill: #ecfeff; stroke: #00add8; stroke-width: 1.5; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sublabel { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#ah); }
    ]]></style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" class="title">Identity backbone (stamp at span start)</text>

  <rect x="40" y="80" width="150" height="70" class="box" rx="8"/>
  <text x="115" y="110" text-anchor="middle" class="label">session</text>
  <text x="115" y="130" text-anchor="middle" class="sublabel">sess-demo-42</text>

  <line x1="190" y1="115" x2="230" y2="115" class="arrow"/>

  <rect x="230" y="80" width="150" height="70" class="box" rx="8"/>
  <text x="305" y="110" text-anchor="middle" class="label">workflow</text>
  <text x="305" y="130" text-anchor="middle" class="sublabel">sre-investigate</text>

  <line x1="380" y1="115" x2="420" y2="115" class="arrow"/>

  <rect x="420" y="80" width="150" height="70" class="box-hot" rx="8"/>
  <text x="495" y="110" text-anchor="middle" class="label">stage</text>
  <text x="495" y="130" text-anchor="middle" class="sublabel">plan | gather | present</text>

  <line x1="570" y1="115" x2="610" y2="115" class="arrow"/>

  <rect x="610" y="80" width="150" height="70" class="box" rx="8"/>
  <text x="685" y="110" text-anchor="middle" class="label">persona</text>
  <text x="685" y="130" text-anchor="middle" class="sublabel">observer-sre</text>

  <rect x="140" y="200" width="520" height="80" class="box" rx="8"/>
  <text x="400" y="230" text-anchor="middle" class="label">Every child span inherits the envelope</text>
  <text x="400" y="255" text-anchor="middle" class="sublabel">Same latency/tokens can mean helper summary vs user-facing present</text>
</svg>
