<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Agent token and tool metrics</title>
  <desc id="desc">Dashboard with session token burn and per-tool latency table.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #111217; }
      .panel { fill: #181b21; stroke: #2b303b; }
      .h { font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #e5e7eb; }
      .m { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #9ca3af; }
      .q { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
      .cell { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d1d5db; }
      .axis { stroke: #2b303b; stroke-width: 1; }
      .grid { stroke: #232833; stroke-width: 1; }
      .burn { fill: none; stroke: #73bf69; stroke-width: 2.25; }
      .budget { fill: none; stroke: #f2cc0c; stroke-width: 1.75; stroke-dasharray: 5 4; }
      .bar { fill: #3274d9; }
      .warn { fill: #f2cc0c; font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    ]]></style>
  </defs>

  <rect width="900" height="340" class="bg" rx="8"/>

  <rect x="16" y="16" width="520" height="308" class="panel" rx="6"/>
  <text x="32" y="42" class="h">agent_tokens_total</text>
  <text x="32" y="60" class="q">sum by (agent) (rate(agent_tokens_total[5m]))</text>

  <line x1="48" y1="100" x2="510" y2="100" class="grid"/>
  <line x1="48" y1="150" x2="510" y2="150" class="grid"/>
  <line x1="48" y1="200" x2="510" y2="200" class="grid"/>
  <line x1="48" y1="250" x2="510" y2="250" class="axis"/>
  <line x1="48" y1="90" x2="48" y2="250" class="axis"/>

  <polyline points="48,230 110,222 172,210 234,218 296,188 358,176 420,152 510,128" class="burn"/>
  <polyline points="48,168 510,168" class="budget"/>

  <text x="48" y="274" class="m">12:00</text>
  <text x="250" y="274" class="m">12:15</text>
  <text x="470" y="274" class="m">12:30</text>

  <rect x="48" y="292" width="10" height="10" fill="#73bf69"/>
  <text x="64" y="301" class="m">token burn</text>
  <rect x="160" y="292" width="10" height="10" fill="#f2cc0c"/>
  <text x="176" y="301" class="m">budget (rolling avg)</text>

  <rect x="552" y="16" width="332" height="308" class="panel" rx="6"/>
  <text x="568" y="42" class="h">Tool calls | sess_8f2a91c</text>
  <text x="568" y="60" class="q">topk(tool_latency_ms) by tool</text>

  <text x="568" y="96" class="m">Tool</text>
  <text x="730" y="96" class="m">p50</text>
  <text x="790" y="96" class="m">Calls</text>
  <text x="850" y="96" class="m">Tok</text>
  <line x1="568" y1="106" x2="860" y2="106" class="axis"/>

  <text x="568" y="132" class="cell">grafana_query_range</text>
  <text x="730" y="132" class="cell">805ms</text>
  <text x="790" y="132" class="warn">2</text>
  <text x="850" y="132" class="cell">-</text>
  <rect x="568" y="142" width="180" height="6" class="bar" rx="2"/>

  <text x="568" y="178" class="cell">llm.generate</text>
  <text x="730" y="178" class="cell">1.08s</text>
  <text x="790" y="178" class="cell">3</text>
  <text x="850" y="178" class="cell">3.3k</text>
  <rect x="568" y="188" width="240" height="6" class="bar" rx="2"/>

  <text x="568" y="224" class="cell">k8s.get_events</text>
  <text x="730" y="224" class="cell">410ms</text>
  <text x="790" y="224" class="cell">1</text>
  <text x="850" y="224" class="cell">-</text>
  <rect x="568" y="234" width="92" height="6" class="bar" rx="2"/>

  <text x="568" y="270" class="cell">llm.subagent</text>
  <text x="730" y="270" class="cell">920ms</text>
  <text x="790" y="270" class="cell">1</text>
  <text x="850" y="270" class="cell">1.2k</text>
  <rect x="568" y="280" width="205" height="6" class="bar" rx="2"/>

  <text x="568" y="308" class="m">Last 30m | env=demo</text>
</svg>
