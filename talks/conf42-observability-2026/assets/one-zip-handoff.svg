<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">One zip per conversation</title>
  <desc id="desc">Before many execution exports, after one conversation debug zip.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #334155; }
      .box-good { fill: #052e1c; stroke: #34d399; }
      .h { font: 600 14px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .l { font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .item { font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .good { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a7f3d0; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#ah); }
    ]]></style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="360" class="bg" rx="8"/>
  <text x="360" y="36" text-anchor="middle" class="h">Support handoff</text>

  <rect x="40" y="70" width="260" height="230" class="box" rx="8"/>
  <text x="170" y="102" text-anchor="middle" class="l">Before</text>
  <text x="170" y="140" text-anchor="middle" class="item">exec-01.zip</text>
  <text x="170" y="164" text-anchor="middle" class="item">exec-02.zip</text>
  <text x="170" y="188" text-anchor="middle" class="item">exec-03.zip</text>
  <text x="170" y="212" text-anchor="middle" class="item">exec-04.zip</text>
  <text x="170" y="250" text-anchor="middle" class="item">which run failed?</text>

  <path d="M320 185 H380" class="arrow"/>

  <rect x="400" y="70" width="280" height="230" class="box-good" rx="8"/>
  <text x="540" y="102" text-anchor="middle" class="l">After</text>
  <text x="540" y="160" text-anchor="middle" class="good">conversation-debug.zip</text>
  <text x="540" y="190" text-anchor="middle" class="good">sess_8f2a91c</text>
  <text x="540" y="220" text-anchor="middle" class="good">trace + events + grade</text>
  <text x="540" y="260" text-anchor="middle" class="good">one download</text>
</svg>
