<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">One zip per conversation vs per-execution export</title>
  <desc id="desc">Before: many execution exports per support ticket. After: one conversation-scoped debug zip.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .box-good { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .item { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#ah2); }
    ]]></style>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" class="title">One zip, one conversation</text>
  <text x="360" y="52" text-anchor="middle" class="subtitle">Support thinks in threads - not twelve execution IDs</text>

  <rect x="40" y="90" width="260" height="220" class="box" rx="8"/>
  <text x="170" y="120" text-anchor="middle" class="label">Before</text>
  <text x="170" y="160" text-anchor="middle" class="item">exec-01.zip</text>
  <text x="170" y="185" text-anchor="middle" class="item">exec-02.zip</text>
  <text x="170" y="210" text-anchor="middle" class="item">exec-03.zip</text>
  <text x="170" y="235" text-anchor="middle" class="item">...</text>
  <text x="170" y="270" text-anchor="middle" class="item">Scavenger hunt</text>

  <line x1="320" y1="200" x2="380" y2="200" class="arrow"/>

  <rect x="400" y="90" width="280" height="220" class="box-good" rx="8"/>
  <text x="540" y="120" text-anchor="middle" class="label">After</text>
  <text x="540" y="170" text-anchor="middle" class="item">conversation-debug.zip</text>
  <text x="540" y="200" text-anchor="middle" class="item">whole thread</text>
  <text x="540" y="230" text-anchor="middle" class="item">trace + events + grade</text>
  <text x="540" y="270" text-anchor="middle" class="item">One download</text>

  <text x="360" y="360" text-anchor="middle" class="item">Then grade a week of folders - recurring patterns become product gates</text>
</svg>
